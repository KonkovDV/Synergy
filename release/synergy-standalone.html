  --bg: #f3f5f7; --bg2: #e8edf0; --card: #ffffff; --card2: #f3f5f7; --line: #e1e6ea; --line-strong: #c6d0d8;
  --text: #05101a; --muted: #56616d; --accent: #16e182; --accent-ink: #0a7a47; --on-accent: #05101a;
  --a: #ff7a45; --a-ink: #b53d0d; --b: #3b82f6; --b-ink: #1d5fbf; --violet: #6d4ef0; --co-ink: #5b3fd6;
  --good: #16e182; --good-ink: #0a7a47; --warn: #f5a524; --warn-ink: #8a4f00; --bad: #ef4444; --bad-ink: #c21b2e;
  --track: #e6ebef; --star-empty: #d0d9e0; --switch-off: #e8edf0; --switch-edge: #6f7b87; --switch-knob: #56616d;
  --tint-green: #e3faef; --tint-teal: #ddf6f3; --tint-blue: #e4eefc; --tint-violet: #ece8fd; --tint-coral: #fde9e3; --tint-yellow: #fdf3d8;
  --deco-green: #c7f3df; --deco-teal: #bfeee8; --deco-blue: #d3e4fb; --deco-violet: #e2dcfc; --deco-coral: #fcdccf; --deco-yellow: #fae6b0;
  --ico-green: #0a7047; --ico-teal: #0b6b63; --ico-blue: #1d5fbf; --ico-violet: #5b3fd6; --ico-coral: #b53d0d; --ico-yellow: #7a5200;
  --heat-0: #e8edf0; --heat-1: #c2f3dc; --heat-2: #7fe9b8; --heat-3: #2fd88f; --heat-4: #0aa865;
  --grad-primary: linear-gradient(120deg, #16e182 0%, #1fd0a6 55%, #25c2c4 100%);
  --grad-hero: linear-gradient(125deg, #16e182 0%, #1fd0a6 38%, #25c2c4 66%, #2fa6e0 100%);
  --grad-cover: radial-gradient(120% 90% at 85% 0%, #1b4e8f 0%, transparent 55%), radial-gradient(90% 80% at 0% 100%, #0f6b55 0%, transparent 60%), linear-gradient(160deg, #0b1d2b 0%, #071019 100%);
  --grad-good: linear-gradient(90deg, #16e182 0%, #25c2c4 100%);
  --grad-a: linear-gradient(0deg, #f2622e 0%, #ffa06b 100%);
  --grad-b: linear-gradient(0deg, #2f6fe0 0%, #7fb0ff 100%);
  --hero-text: #05101a; --hero-muted: #0b2a2a; --hero-track: #ffffff; --hero-ring: #05101a; --cover-text: #ffffff; --cover-muted: #d6e2ea;
  --shadow-1: 0 1px 2px rgba(5, 16, 26, .05), 0 6px 18px rgba(5, 16, 26, .06);
  --shadow-2: 0 2px 6px rgba(5, 16, 26, .06), 0 18px 40px rgba(5, 16, 26, .12);
  --glow-accent: 0 8px 22px rgba(22, 225, 130, .32);
  --backdrop: rgba(5, 16, 26, .55);
  --spring: cubic-bezier(.2, .9, .25, 1.25);
  --radius: 22px; --tap: 52px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-display: "Unbounded", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Dark: by the system setting (unless light is chosen) or by choice — the brand's dark covers. Two copies, one set of values. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #071019; --bg2: #0e1a24; --card: #101c27; --card2: #15232f; --line: #213140; --line-strong: #34495a;
    --text: #eef3f6; --muted: #a3b3c0; --accent-ink: #3ef0a0;
    --a: #ff8a52; --a-ink: #ffb084; --b: #4d94ff; --b-ink: #8ab8ff; --violet: #8a6dff; --co-ink: #c3b3ff;
    --good-ink: #4cf0a6; --warn-ink: #ffd27a; --bad-ink: #ff9aa4;
    --track: #1b2a37; --star-empty: #34495a; --switch-off: #15232f; --switch-edge: #8a9caa; --switch-knob: #a3b3c0;
    --tint-green: #0d2a22; --tint-teal: #0c2829; --tint-blue: #0f2238; --tint-violet: #1a1838; --tint-coral: #2e1a17; --tint-yellow: #2b2414;
    --deco-green: #12382c; --deco-teal: #113637; --deco-blue: #152d4a; --deco-violet: #231f4a; --deco-coral: #3d221d; --deco-yellow: #3a301a;
    --ico-green: #4cf0a6; --ico-teal: #5fe3d4; --ico-blue: #8ab8ff; --ico-violet: #c3b3ff; --ico-coral: #ffb084; --ico-yellow: #ffd27a;
    --heat-0: #15232f; --heat-1: #0f4a35; --heat-2: #0e7a52; --heat-3: #12b36f; --heat-4: #3ef0a0;
    --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 6px 18px rgba(0, 0, 0, .35);
    --shadow-2: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 16px 36px rgba(0, 0, 0, .5);
    --backdrop: rgba(2, 6, 10, .72);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #071019; --bg2: #0e1a24; --card: #101c27; --card2: #15232f; --line: #213140; --line-strong: #34495a;
  --text: #eef3f6; --muted: #a3b3c0; --accent-ink: #3ef0a0;
  --a: #ff8a52; --a-ink: #ffb084; --b: #4d94ff; --b-ink: #8ab8ff; --violet: #8a6dff; --co-ink: #c3b3ff;
  --good-ink: #4cf0a6; --warn-ink: #ffd27a; --bad-ink: #ff9aa4;
  --track: #1b2a37; --star-empty: #34495a; --switch-off: #15232f; --switch-edge: #8a9caa; --switch-knob: #a3b3c0;
  --tint-green: #0d2a22; --tint-teal: #0c2829; --tint-blue: #0f2238; --tint-violet: #1a1838; --tint-coral: #2e1a17; --tint-yellow: #2b2414;
  --deco-green: #12382c; --deco-teal: #113637; --deco-blue: #152d4a; --deco-violet: #231f4a; --deco-coral: #3d221d; --deco-yellow: #3a301a;
  --ico-green: #4cf0a6; --ico-teal: #5fe3d4; --ico-blue: #8ab8ff; --ico-violet: #c3b3ff; --ico-coral: #ffb084; --ico-yellow: #ffd27a;
  --heat-0: #15232f; --heat-1: #0f4a35; --heat-2: #0e7a52; --heat-3: #12b36f; --heat-4: #3ef0a0;
  --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 6px 18px rgba(0, 0, 0, .35);
  --shadow-2: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 16px 36px rgba(0, 0, 0, .5);

}
/* High contrast (Settings → Доступность, or the system asks for more contrast): black, white, yellow — above any theme. */
:root.hc {
  color-scheme: dark;
  --bg: #000; --bg2: #000; --card: #000; --card2: #101010; --line: #ffffff; --line-strong: #ffffff;
  --text: #ffffff; --muted: #e8ecff; --accent: #ffe14d; --accent-ink: #ffe14d; --on-accent: #000;
  --a: #ffb547; --a-ink: #ffb547; --b: #5ad1ff; --b-ink: #5ad1ff; --violet: #e879f9; --co-ink: #f0abfc;
  --good: #3fe0a0; --good-ink: #3fe0a0; --warn: #ffcc4d; --warn-ink: #ffcc4d; --bad: #ff6b6b; --bad-ink: #ff8a8a;
  --track: #333; --star-empty: #555; --switch-off: #000; --switch-edge: #fff; --switch-knob: #fff;
  --tint-green: #000; --tint-teal: #000; --tint-blue: #000; --tint-violet: #000; --tint-coral: #000; --tint-yellow: #000;
  --deco-green: #000; --deco-teal: #000; --deco-blue: #000; --deco-violet: #000; --deco-coral: #000; --deco-yellow: #000;
  --ico-green: #fff; --ico-teal: #fff; --ico-blue: #fff; --ico-violet: #fff; --ico-coral: #fff; --ico-yellow: #fff;
  --heat-0: #222; --heat-1: #3c6e5a; --heat-2: #2f9e72; --heat-3: #3fe0a0; --heat-4: #b6ffe0;
  --grad-primary: #ffe14d; --grad-hero: #000; --grad-cover: #000; --grad-good: #3fe0a0; --grad-a: #ffb547; --grad-b: #5ad1ff;
  --hero-text: #fff; --hero-muted: #e8ecff; --hero-track: #333; --hero-ring: #fff; --cover-text: #fff; --cover-muted: #e8ecff;
  --shadow-1: none; --shadow-2: none; --glow-accent: none; --backdrop: rgba(0, 0, 0, .85);
}

/* ===== Base: layout and structure (5.x) ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html { font-size: calc(16px * var(--text-scale, 1)) }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text) }
body { font: 1rem/1.45 var(--font) }
body { overscroll-behavior: none }
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh;                        position: relative }
h1 { line-height: 1.15; margin: 4px 0 8px }
h2 { font-size: 1.125rem; margin: 0 0 10px }
p { margin: 8px 0 }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.screen { display: flex; flex-direction: column; min-height: 100dvh }
.scroll { flex: 1; padding: 16px 16px 120px }
.scroll.center { text-align: center }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }
.eyebrow { font-size: 0.8125rem; font-weight: 700;                      text-transform: uppercase;                       margin: 0 }
.note { font-size: 0.875rem; color: var(--muted) }
.note.warn { color: var(--warn) }
.lead { font-size: 1.188rem; font-weight: 600 }

.card { padding: 16px; margin: 14px 0; text-align: left }
.card-head { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: space-between; align-items: center } /* the pill wraps under the title at 200 % on 320 px */
.card-head > h2 { min-width: 0 }
.pill { background: var(--card2); border-radius: 99px; padding: 2px 10px; font-weight: 700; font-size: 0.875rem }

.btn { min-height: var(--tap);                      border: 1px solid var(--line); background: var(--card2); padding: 12px 18px; font-weight: 700; cursor: pointer }

.btn.primary { border-color: transparent }
.btn.big { width: 100% }

.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad) }
.btn:disabled { opacity: .5; cursor: default }
.icon-btn { min-width: 48px; min-height: 48px; border: 0; background: transparent; font-size: 1.375rem; cursor: pointer; border-radius: 14px }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px }
.row-actions .btn { flex: 1 }
.row-actions.col { flex-direction: column }
.sticky-actions { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 10px); display: grid; gap: 8px } /* 5.12.1: the fade ends above the items — at 30 % the onboarding dots sat on a half-visible line (a device report) */

/* Bottom navigation (thumb zone). */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);                                display: grid;                                                                border-top: 1px solid var(--line);                                              z-index: 5 }
.nav-item { border: 0; background: transparent; color: var(--muted);                place-items: center; font-size: 0.75rem; font-weight: 600; cursor: pointer }
.nav-item.active { color: var(--accent) }
.nav-icon { font-size: 1.25rem; line-height: 1 }

.top-bar { display: grid;                                       align-items: center; padding: 8px; position: sticky; top: 0; background: var(--bg); z-index: 3 }
.top-bar h1 { font-size: 1.188rem; text-align: center; margin: 0 }

/* Home. */
.hero { border-radius: 24px; padding: 16px }
.hero-top { display: grid;                                       gap: 12px; align-items: center }
.hero h1 { margin: 0 }
.avatar { border-radius: 18px;                           display: grid; place-items: center; overflow: hidden }
.avatar canvas { width: 44px; height: 44px }
.streak { display: flex; align-items: center; gap: 4px;                                                    border-radius: 99px; padding: 6px 12px; font-size: 1.125rem }
.xp { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 14px 0 6px; font-size: 0.875rem; font-weight: 600 }
.xp small { color: var(--muted) }
.xp-track, .skill-track { border-radius: 99px; overflow: hidden }
.xp-track i, .skill-track i { display: block; height: 100%;                          border-radius: 99px; transition: width .6s cubic-bezier(.2,.9,.3,1.2) }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; text-align: center }
.day i { display: block;                            margin: 0 auto 2px; border-radius: 50%; border: 2px solid var(--line) }

.day.today i { border-color: var(--accent) }
.day small { color: var(--muted) }
.week-note { grid-column: 1 / -1; margin: 6px 0 0; font-size: 0.8125rem; color: var(--muted) }
.plan-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px }
.plan-list li { display: grid;                                  gap: 10px; align-items: center;                                                padding: 8px 10px }

.plan-list small { display: block; color: var(--muted); font-size: 0.8125rem }
.plan-icon { text-align: center }
.tip p { margin: 4px 0 0; color: var(--muted) }
.games h2 { margin-top: 18px }
.game-grid { display: grid }
.game-card { text-align: left; border: 1px solid var(--line);                               padding: 14px; background: var(--card);                    display: flex; flex-direction: column; gap: 4px; cursor: pointer }

.game-card small { color: var(--muted); font-size: 0.8125rem; flex: 1 }

.game-meta { font-size: 0.75rem;                     font-weight: 700 }

/* Levels. */
.game-hero { font-size: 3rem; margin: 0; text-align: center }
.how { padding-left: 20px; margin: 8px 0; text-align: left }
.how li { margin: 4px 0 }
.level-grid { display: grid;                                        gap: 10px }
.level { aspect-ratio: 1;                      border: 1px solid var(--line);                          display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer }
.level b { font-size: 1.375rem }
.level small { color: var(--warn); letter-spacing: 1px }

.level.locked { opacity: .45 }

/* Play. */
.play-screen { height: 100dvh; min-height: 0 }
.play-top { display: grid;                                            align-items: center; gap: 4px; padding: 4px 8px }
.play-title b, .play-title h1 { display: block; font-size: 0.9375rem; margin: 0; line-height: 1.25 }
.play-title small { color: var(--warn); font-size: 0.75rem; font-weight: 700 }
.score { font-size: 1.375rem; min-width: 48px; text-align: right; padding-right: 6px }
.play-progress { height: 4px; background: rgba(255,255,255,.08) }
.play-progress i { display: block; height: 100%; width: 0;                            transition: width .2s linear }
.stage { position: relative; flex: 1 }
.stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
.stage-hint { left: 12px; right: 12px; bottom: 8px;            text-align: center; font-size: 0.875rem; font-weight: 600; color: var(--text);                                                      padding: 6px 10px; pointer-events: none }
.play-screen.lost .stage-hint { background: var(--bad); color: #fff }
.overlay { position: absolute; inset: 0; background: rgba(8,12,30,.78); display: grid; place-items: end center; padding: 12px; overflow: auto }
.overlay[hidden] { display: none }
.sheet { width: 100%;                          border: 1px solid var(--line);                      padding: 18px; max-height: 100%; overflow: auto; animation: rise .25s cubic-bezier(.2,.9,.3,1.15) }
.sheet.small { max-width: 420px }
.sheet h2 { font-size: 1.375rem }
.legend { font-size: 0.8125rem; color: var(--muted); background: var(--card2); border-radius: 12px; padding: 8px 10px }
@keyframes rise { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }

.confirm { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 0.8125rem; color: var(--muted); margin: 10px 0 }
.confirm-ring, .cal-ring { --p: 0; width: 28px; height: 28px; border-radius: 50%;                                                                                        flex: none; position: relative }
.confirm-ring::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--card) }

/* Signal meter. */
.meter { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 6px 10px;                         border-top: 1px solid var(--line) }
.meter-row { display: flex; align-items: center; gap: 6px }
.meter-label { font-weight: 800; width: 16px; text-align: center }
.meter-label.a { color: var(--a) } .meter-label.b { color: var(--b) }
.meter-bar { position: relative; flex: 1; height: 14px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden }
.meter-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px }
.meter-bar.b { transform: scaleX(-1) }
.mark { position: absolute; top: 0; bottom: 0; width: 2px }
.mark.on { background: #fff; opacity: .7 }
.mark.co { background: var(--violet) }
.meter-chip { min-width: 104px; text-align: center; font-weight: 800; font-size: 0.8125rem; border-radius: 99px; padding: 4px 10px; background: var(--card2) }
.meter-chip[data-cmd="close"] { background: var(--a); color: #2b1800 }
.meter-chip[data-cmd="open"] { background: var(--b); color: #00202c }
.meter-chip[data-cmd="switch"] { background: var(--violet); color: #fff }
.meter-chip[data-cmd="lost"] { background: var(--bad); color: #fff }

/* Emulator pads. */
.controls { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: var(--bg2) }
.pads.two { display: grid;                                      gap: 10px }
.pad { position: relative;                      overflow: hidden; background: var(--card2); border: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer }
.pad.on { border-color: #fff }
.pad-a .pad-fill { background: linear-gradient(0deg, var(--a), rgba(255,181,71,.5)) }
.pad-b .pad-fill { background: linear-gradient(0deg, var(--b), rgba(90,209,255,.5)) }
.pad-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height .05s linear }
.pad-ticks { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 calc(25% - 1px), rgba(255,255,255,.12) calc(25% - 1px) 25%); pointer-events: none }
.pad-label { left: 12px; top: 10px; display: grid; pointer-events: none }
.pad-label b { font-size: 1.75rem }
.pad-label span { font-size: 0.8125rem; color: var(--muted) }
.pad-value { right: 12px; bottom: 10px; font-weight: 800; font-size: 1.125rem; pointer-events: none }
.pad-co { border-radius: 18px; border: 2px dashed var(--violet); background: transparent; color: var(--violet); font-weight: 800; touch-action: none; cursor: pointer }
.pad-co.on { background: var(--violet); color: #fff }
.pads.gestures { display: grid;                                                   gap: 8px }
.gkey { min-width: 0; border-radius: 16px; background: var(--card2); border: 2px solid var(--line); display: grid; grid-template-columns: 36px minmax(0, 1fr); align-items: center; gap: 4px; padding: 4px 6px;                          line-height: 1.15; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; font-size: 0.8125rem; font-weight: 700 }
.gkey.on { border-color: var(--a); background: #3b2e1a }
.gesture-icon { width: 36px; height: 36px; pointer-events: none }
.avatar .gesture-icon { width: 44px; height: 44px }
.pads-note { grid-column: 1 / -1; text-align: center; font-size: 0.75rem; color: var(--muted); margin: 2px 0 0 }
.bridge-panel { text-align: center; padding: 6px; display: grid; gap: 2px }

.controls.compact .gkey { min-height: 48px }
.bridge-status { color: var(--muted); font-size: 0.8125rem }

/* Results & rest. */
.big-stars { color: var(--warn); animation: pop .5s cubic-bezier(.2,.9,.3,1.4) }
.big-stars.s0 { color: var(--muted) }
.big-score { margin: 0 }
.big-score small { font-size: 1.125rem; color: var(--muted) }
.xp-gain { color: var(--good); font-weight: 700 }
.celebrate { text-align: center }
.skill { display: grid;                                        gap: 10px; align-items: center; margin: 8px 0; font-size: 0.875rem }
.skill b { text-align: right }
.coach p { color: var(--muted) }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
.breath { width: 140px; height: 140px; margin: 16px auto; border-radius: 50%; background: radial-gradient(circle, var(--accent), #1d2b5a 70%); animation: breathe 8s ease-in-out infinite }
@keyframes breathe { 0%, 100% { transform: scale(.7) } 50% { transform: scale(1) } }
.rest-count { display: block; font-size: 3rem }
.rest .meter { border-radius: 14px; margin: 10px 0 }

/* Progress. */
.stats { display: grid;                                        gap: 8px }
.stats div { padding: 10px 4px; text-align: center }
.stats b { display: block }
.stats small { color: var(--muted) }
.radar { display: block }
.trend { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center }
.calendar small { color: var(--muted) }
.cal { aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,.07) }
.cal.l1 { background: rgba(63,224,160,.3) } .cal.l2 { background: rgba(63,224,160,.5) }
.cal.l3 { background: rgba(63,224,160,.75) } .cal.l4 { background: var(--good) }
.cal.future { opacity: .3 }
.badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.badge { background: var(--card2); border-radius: 14px; padding: 10px; opacity: .55; display: grid; gap: 2px }
.badge.on { opacity: 1 }
.badge small { color: var(--muted); font-size: 0.75rem }
.skins { display: grid;                                        gap: 8px }
.skin { border: 2px solid var(--line); background: var(--card2); border-radius: 14px; padding: 6px; display: grid; justify-items: center; cursor: pointer }
.skin.active { border-color: var(--accent) }
.skin small { color: var(--muted) }

/* Settings. */
.segmented { display: grid;                         grid-auto-columns: 1fr; gap: 6px;                                              padding: 4px; margin: 6px 0 }
.seg { min-height: 52px; border: 0;                      background: transparent; color: var(--muted); cursor: pointer; display: grid; align-content: center; padding: 6px }
.seg b { font-size: 0.875rem }

.row { display: grid; gap: 6px; margin: 12px 0; font-size: 0.9375rem }
.row > span { display: flex; justify-content: space-between; gap: 8px }
.row small { display: block; color: var(--muted); font-size: 0.75rem }
.row.toggle { grid-template-columns: 1fr auto; align-items: center }
.row input[type=text], .row input[type=url], .row input[type=time] { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 0 12px; font: inherit }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px }
input[type=checkbox] { width: 48px; height: 28px; accent-color: var(--good) }
output { color: var(--accent); font-weight: 700 }
.settings .pads.two { margin: 8px 0 }
.cal-ring { width: 120px; height: 120px; margin: 12px auto }
.cal-ring::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: var(--bg) }
.cal-ring[data-step="a"] { background: conic-gradient(var(--a) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0) }
.cal-ring[data-step="b"] { background: conic-gradient(var(--b) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0) }
.calibration .pads.two { margin-top: 12px }

/* Onboarding. */
.onboarding .scroll { padding-top: 40px }
.onb-art { display: grid; place-items: center; margin: 10px auto 16px }
.onb-art canvas { width: 110px; height: 110px }
.big-emoji { font-size: 4.5rem }
.onboarding .sticky-actions { padding-left: 16px; padding-right: 16px }
.dots { display: flex; gap: 8px; justify-content: center }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line) }
.dots i.on { background: var(--accent); width: 22px; border-radius: 99px }

/* Toasts. */
#toasts { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; width: min(92vw, 420px); pointer-events: none }
.toast { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 700; text-align: center; animation: rise .25s ease; transition: opacity .4s }
.toast.good { border-color: var(--good) }
.toast.bad { border-color: var(--bad) }
.toast.out { opacity: 0 }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important }
}
@media (min-width: 700px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line) } }

/* v5: check-in, tutorial, skill check, data tables, showcase, PIN. */
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.8125rem }
.showcase-banner { position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--warn); color: #241a00; font-weight: 800; font-size: 0.8125rem; padding: 4px 12px }
.showcase-banner .btn { color: #241a00; border-color: #241a00 }
.warn-card { border-color: var(--warn) }
.tutorial-card { border-color: var(--accent) }

.g-check.due { border: 2px solid var(--accent) }
.checkin .segmented { grid-auto-flow: row }
.checkin-advice { min-height: 48px }
.tut-canvas { width: min(320px, 100%); height: auto; aspect-ratio: 4 / 3; display: block; margin: 0 auto }
.tut-ring { width: 64px; height: 64px }

.pin-input { font-size: 2rem; letter-spacing: 0.5em; text-align: center;              min-height: 60px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg2); color: var(--text); margin: 12px auto; display: block }
table.data { width: 100%; border-collapse: collapse; font-size: 0.8125rem }
table.data caption { text-align: left; color: var(--muted); font-size: 0.75rem; padding-bottom: 4px }
table.data th, table.data td { border: 1px solid var(--line);                   text-align: center }
table.data th[scope="row"] { text-align: left; font-weight: 700 }
td.heat.h1 { background: rgba(255,107,107,.18) } td.heat.h2 { background: rgba(255,107,107,.35) }
td.heat.h3 { background: rgba(255,107,107,.55) } td.heat.h4 { background: rgba(255,107,107,.8); color: #fff }


/* ===== 5.12 design layer — «Моторика × ФинФениксы». The base rules above hold layout; this layer is the look.
   Rules: solid surfaces under text, decoration only behind content, every motion off with .rm / prefers-reduced-motion,
   every gradient flattened by .hc (tokens) and forced colours. ===== */
body {
  background:
    radial-gradient(560px 340px at 108% -8%, var(--deco-green), transparent 70%),
    radial-gradient(520px 380px at -14% 22%, var(--deco-blue), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
.app { background: transparent }
h1 { font-family: var(--font-display); font-size: 1.625rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15 }
/* Screen titles: the brochure's upper-case Unbounded with a short green bar under it. */
.scroll > h1:not(.sr-only):not(.eyebrow), .onb-hero h1 { text-transform: uppercase; letter-spacing: 0.01em }
.scroll > h1:not(.sr-only):not(.eyebrow)::after { content: ''; display: block; width: 44px; height: 4px; margin-top: 10px; border-radius: 2px; background: var(--grad-primary) }
h2 { font-weight: 800; letter-spacing: -0.2px }
.stats b, .big-score, .score, .streak b, .pill, output, .rest-count, table.data td { font-variant-numeric: tabular-nums }
.big-score, .score, .stats b, .rest-count, .level b, .sync-value, .streak b { font-family: var(--font-display); font-weight: 700 }
.eyebrow { font-weight: 800; letter-spacing: 1px; color: var(--accent-ink) }
.note.warn { color: var(--warn-ink); font-weight: 600 }
.art { display: block; flex: none }

/* Surfaces: white cards on the light-grey page (the sample), flat with a soft shadow (the brochure). */
.card { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-1); border-radius: var(--radius) }
.card h2 { display: flex; align-items: center; gap: 8px }
.pill { background: var(--tint-green); color: var(--accent-ink); font-weight: 800; padding: 3px 11px }
.with-art { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px } /* the text column shrinks and wraps */
.with-art .art { width: 1.75rem; height: 1.75rem }
.tinted { position: relative; overflow: hidden; background: var(--tint); border-color: transparent }
.tinted::after { content: ''; position: absolute; right: -36px; bottom: -48px; width: 128px; height: 128px; border-radius: 50%; background: var(--deco); pointer-events: none }
.tinted > * { position: relative; z-index: 1 }
.t-green, .g-check { --tint: var(--tint-green); --deco: var(--deco-green); --ico: var(--ico-green) }
.t-teal, .g-safe { --tint: var(--tint-teal); --deco: var(--deco-teal); --ico: var(--ico-teal) }
.t-blue, .g-flight { --tint: var(--tint-blue); --deco: var(--deco-blue); --ico: var(--ico-blue) }
.t-violet, .g-rhythm { --tint: var(--tint-violet); --deco: var(--deco-violet); --ico: var(--ico-violet) }
.t-coral, .g-grip { --tint: var(--tint-coral); --deco: var(--deco-coral); --ico: var(--ico-coral) }
.t-yellow, .g-tutorial, .tutorial-card { --tint: var(--tint-yellow); --deco: var(--deco-yellow); --ico: var(--ico-yellow) }

/* Buttons: pill-shaped (M3 Expressive, the sample); the primary one in the brand green with near-black text (11:1). */
.btn { border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--text); font-weight: 800; transition: transform .18s var(--spring), box-shadow .18s ease, filter .18s ease }
.btn:hover { filter: brightness(1.03) }
.btn:active { transform: scale(.96) }
.btn.primary { background: var(--grad-primary); color: var(--on-accent); border-color: transparent; box-shadow: var(--glow-accent) }
.btn.primary:disabled { box-shadow: none; filter: saturate(.4) }
.btn.big { min-height: 64px; font-size: 1.125rem; letter-spacing: .1px }
.btn.ghost { background: var(--card) }
.btn.danger { background: var(--card); border-color: var(--bad-ink); color: var(--bad-ink) }
.top-bar .icon-btn, .play-top .icon-btn { background: var(--card); box-shadow: var(--shadow-1); border-radius: 50%; color: var(--text) }
.top-bar h1 { font-size: 1.0625rem; font-weight: 700 }

/* Home hero: the brand gradient tile (green → teal → blue) with near-black text, Мио on a white tile, light trails. */
.hero { position: relative; overflow: hidden; background: var(--grad-hero); color: var(--hero-text); border-radius: 28px; padding: 18px 16px 16px; box-shadow: var(--shadow-2) }
.hero > * { position: relative }
.hero > .trails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
.hero h1 { color: var(--hero-text) }
.hero .eyebrow { color: var(--hero-muted) }
.avatar { background: #ffffff; border-radius: 20px; box-shadow: 0 6px 16px rgba(5, 16, 26, .18) }
.avatar .art { width: 88%; height: 88% }
.streak { background: #05101a; color: #ffffff; font-weight: 850; padding: 6px 12px 6px 8px }
.streak .art { width: 1.5rem; height: 1.5rem }
.xp-track, .skill-track { height: 12px; background: var(--track) }
.xp-track i, .skill-track i { background: var(--grad-good) }
.hero .xp-track { background: var(--hero-track) }
.hero .xp-track i { background: #05101a }
.hero .xp small, .hero .week-note, .hero .day small { color: var(--hero-muted) }
.day i { width: 30px; height: 30px; border-color: var(--hero-ring); position: relative }
.day.done i { background: #05101a; border-color: #05101a }
.day.done i::after { content: ''; position: absolute; left: 32%; top: 20%; width: 26%; height: 44%; border: solid #16e182; border-width: 0 3px 3px 0; transform: rotate(40deg) }
.day.today i { border-width: 3px; border-color: #ffffff; box-shadow: 0 0 0 2px #05101a }
.day small { font-weight: 700 }

/* Plan: a stepper of game rows, each with its picture on a tinted tile. */
.plan-list li { background: var(--card2); border: 1px solid var(--line); border-radius: 18px; gap: 12px }
.plan-list li.done { background: var(--tint-green); border-color: transparent }
.plan-icon { display: grid; place-items: center; border-radius: 14px; background: var(--tint) }
.plan-icon .art { width: 82%; height: 82% }
.tip.card { background: var(--tint-green); border-color: transparent }
.tip p { color: var(--text) }
.coach-head b { font-size: 1.0625rem }

/* Games: bento grid of tinted cards with an illustrated tile; the first card spans two columns. */
.game-grid { grid-template-columns: 1fr 1fr; gap: 12px }
.game-card { position: relative; overflow: hidden; border: 1px solid transparent; border-radius: 24px; background: var(--tint); color: var(--text); box-shadow: var(--shadow-1); transition: transform .2s var(--spring); min-height: 160px }
.game-card:first-child { grid-column: 1 / -1; min-height: 150px }
.game-card::after { content: ''; position: absolute; right: -34px; bottom: -46px; width: 130px; height: 130px; border-radius: 50%; background: var(--deco); pointer-events: none }
.game-card > * { position: relative; z-index: 1 }
.game-card:active { transform: scale(.97) }
.game-card b { font-size: 1.0625rem }
.game-icon { display: grid; place-items: center; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-1) }
.game-icon .art { width: 84%; height: 84% }
.game-meta { color: var(--ico); font-weight: 800; display: flex; align-items: center; gap: 4px; flex-wrap: wrap }
.game-meta .art { width: 1rem; height: 1rem }
.g-check.card, .tutorial-card.card { position: relative; overflow: hidden; background: var(--tint); border-color: transparent }
.g-check.card::after, .tutorial-card.card::after { content: ''; position: absolute; right: -40px; top: -50px; width: 130px; height: 130px; border-radius: 50%; background: var(--deco); pointer-events: none }
.g-check.card > *, .tutorial-card.card > * { position: relative; z-index: 1 }
.g-check.due { box-shadow: 0 0 0 2px var(--accent-ink), var(--shadow-1) }

/* Levels. */
.game-hero { width: 96px; height: 96px; margin: 0 auto 6px; border-radius: 30px; display: grid; place-items: center; background: var(--tint); box-shadow: var(--shadow-1) }
.game-hero .art { width: 80%; height: 80% }
.how li::marker { color: var(--accent-ink) }
.level { border-radius: 22px; background: var(--card); color: var(--text); box-shadow: var(--shadow-1); gap: 4px; transition: transform .18s var(--spring) }
.level:active { transform: scale(.95) }
.level b { font-size: 1.5rem }
.level .star-row .art { width: 1rem; height: 1rem }
.level.locked { background: var(--bg2); border-color: transparent; box-shadow: none; cursor: default; opacity: 1 }
.level.locked .art { width: 1.75rem; height: 1.75rem }
.level.rec { background: var(--grad-primary); color: var(--on-accent); border-color: transparent; box-shadow: var(--glow-accent) }
.star-row { display: inline-flex; gap: 2px; justify-content: center; color: var(--star-empty) }
.level.rec .star-row { color: #0b5c43 }

/* Bottom navigation: a floating white pill; the current section in a filled rounded square (the sample). */
.bottom-nav { bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 536px; border: 1px solid var(--line); border-radius: 26px; background: var(--card); box-shadow: var(--shadow-2); padding-bottom: 0 }
.nav-item { min-height: 64px; gap: 2px; color: var(--muted); font-weight: 700 }
.nav-item.active { color: var(--accent-ink); font-weight: 800 }
.nav-item .nav-icon { padding: 5px 18px; border-radius: 16px; transition: background .2s ease }
.nav-item.active .nav-icon { background: var(--grad-primary); color: var(--on-accent); box-shadow: var(--glow-accent) }

/* Segmented control: white chips on a grey track; the chosen one in the brand green. */
.segmented { background: var(--bg2); border: 0; border-radius: 20px }
.seg { border-radius: 16px; color: var(--muted); transition: background .2s ease, transform .18s var(--spring) }
.seg.active { background: var(--grad-primary); color: var(--on-accent); box-shadow: var(--glow-accent) }

/* Play: HUD and meters. */
.play-top { background: var(--card); border-bottom: 1px solid var(--line) }
.play-title h1 { font-family: var(--font); letter-spacing: 0 }
.play-title small { color: var(--warn-ink) }
.score { color: var(--accent-ink) }
.play-progress { background: var(--track) }
.play-progress i { background: var(--grad-primary) }
.overlay { background: var(--backdrop) }
.play-screen.lost .stage-hint { background: var(--bad-ink); color: #ffffff }
.meter { background: var(--card) }
.meter-label.a { color: var(--a-ink) } .meter-label.b { color: var(--b-ink) }
.meter-bar { background: var(--track) }
.meter-bar.a .fill { background: linear-gradient(90deg, #f2622e, #ffa06b) }
.meter-bar.b .fill { background: linear-gradient(90deg, #2f6fe0, #7fb0ff) }
.mark.on { background: var(--text); opacity: .55 }
.meter-chip { background: var(--bg2); color: var(--text) }
.meter-chip[data-cmd="close"] { background: var(--a); color: #2a1000 }
.meter-chip[data-cmd="open"] { background: var(--b); color: #05101a }
.meter-chip[data-cmd="switch"] { background: var(--violet); color: #ffffff }
.meter-chip[data-cmd="lost"] { background: var(--bad-ink); color: #ffffff }
.controls { background: var(--bg) }
.pad { border-radius: 26px; background: var(--card); box-shadow: var(--shadow-1) }
.pad.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--card), var(--shadow-2) }
.pad-a .pad-fill { background: var(--grad-a) }
.pad-b .pad-fill { background: var(--grad-b) }
.pad-ticks { background: repeating-linear-gradient(0deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%) }
/* Labels sit on their own chips: readable over the channel colour that fills the pad. */
.pad-label { background: var(--card); border-radius: 12px; padding: 2px 8px 3px; justify-self: start; align-self: flex-start; max-width: 100% }
.pad-a .pad-label b { color: var(--a-ink) } .pad-b .pad-label b { color: var(--b-ink) }
.pad-label b { font-family: var(--font-display); font-weight: 800 }
.pad-value { background: var(--card); border-radius: 99px; padding: 0 8px }
.pad-co { background: var(--card); color: var(--co-ink); border-color: var(--violet) }
.pad-co.on { background: var(--violet); border-style: solid; color: #ffffff }
.gkey { background: var(--card); box-shadow: var(--shadow-1); color: var(--text); border-radius: 18px }
.gkey.on { border-color: var(--a); background: var(--tint-coral) }
.sheet { border-radius: 28px; box-shadow: var(--shadow-2); background: var(--card) }
.sheet-title { display: flex; align-items: center; gap: 12px }
.sheet-title .tile { width: 52px; height: 52px; flex: none; border-radius: 18px; display: grid; place-items: center; background: var(--tint) }
.sheet-title .tile .art { width: 84%; height: 84% }
.legend { background: var(--bg2); border-radius: 14px }
.confirm-ring, .cal-ring { background: conic-gradient(var(--a) calc(var(--p) * 360deg), var(--track) 0) }

/* Results: stars as a picture, the score in Unbounded, rewards as chips. */
.big-stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0; color: var(--star-empty) }
.big-stars .art { width: min(4.5rem, 21vw, 26vh); height: min(4.5rem, 21vw, 26vh); filter: drop-shadow(0 6px 10px rgba(245, 165, 36, .35)) }
.big-stars .art:nth-child(2) { transform: translateY(-10px) scale(1.12) }
.big-stars.s0 .art { filter: none }
.big-score { font-size: min(3rem, 15vw); letter-spacing: -1px; color: var(--text) }
.xp-gain { display: inline-block; padding: 4px 14px; border-radius: 999px; background: var(--tint-green); color: var(--good-ink); font-weight: 800 }
.celebrate { text-align: center; --tint: var(--tint-green); --deco: var(--deco-green) }
.celebrate .with-art { text-align: left }
.coach.card { background: var(--tint-green); border-color: transparent }
.coach p { color: var(--text) }
.breath { background: radial-gradient(circle at 35% 30%, #ffffff 0%, #9ff5cd 30%, #25c2c4 70%, #2f80ed 100%); box-shadow: 0 0 0 14px var(--tint-teal), var(--glow-accent) }
.rest-count { font-size: 3rem; color: var(--accent-ink) }
.rest .meter { border-radius: 16px; border: 1px solid var(--line) }
.rest .mio { display: block; margin: 0 auto 4px }

/* Progress: the brochure's stacked gradient tiles — green, teal, cyan with dark text; blue, violet with white text. */
.stats div { border-radius: 18px; border: 0; box-shadow: var(--shadow-1); background: #16e182; color: #05101a }
.stats div:nth-child(5n + 2) { background: #1fd0a6 }
.stats div:nth-child(5n + 3) { background: #2fa6e0 }
.stats div:nth-child(5n + 4) { background: #2f6fe0; color: #ffffff }
.stats div:nth-child(5n) { background: #5b4fd6; color: #ffffff }
.stats div small { color: inherit; opacity: 1 }
.stats b { font-size: 1.5rem }
.cal { border-radius: 8px; background: var(--heat-0) }
.cal.l1 { background: var(--heat-1) } .cal.l2 { background: var(--heat-2) }
.cal.l3 { background: var(--heat-3) } .cal.l4 { background: var(--heat-4) }
.cal.future { background: transparent; border: 1.5px dashed var(--line-strong); opacity: 1 }
.badge { background: var(--card2); border: 1px solid var(--line); border-radius: 16px; opacity: 1; color: var(--muted); align-content: start }
.badge .art { width: 2rem; height: 2rem; margin-bottom: 2px; color: var(--star-empty) } /* above the name: «Переключатель» needs the whole width */
.badge.on { background: var(--tint-yellow); border-color: var(--warn); color: var(--text) }
.skin { background: var(--card2); border-radius: 16px; color: var(--text) }
.skin.active { border-color: var(--accent-ink); background: var(--tint-green); box-shadow: var(--glow-accent) }

/* Settings: section glyphs on tinted tiles; the switch is outlined when off, green when on (M3). */
.sec-ico { width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--tint); color: var(--ico) }
.sec-ico .ico { width: 1.375rem; height: 1.375rem }
.fold > summary .sec-head { display: flex; align-items: center; gap: 12px; min-width: 0 }
.row > span { font-weight: 600 }
.row small { font-weight: 400 }
.row input[type=text], .row input[type=url], .row input[type=time], .row input[type=password] { border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--text) }
.row input:focus-visible { border-color: var(--accent-ink) }
input[type=range] { accent-color: #0aa865 }
input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; margin: 0; flex: none; border-radius: 99px; background: var(--switch-off); border: 2px solid var(--switch-edge); position: relative; cursor: pointer; transition: background .2s ease, border-color .2s ease }
input[type=checkbox]::before { content: ''; position: absolute; left: 4px; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--switch-knob); transform: translateY(-50%); transition: left .2s var(--spring), width .2s ease, height .2s ease, background .2s ease }
input[type=checkbox]:checked { background: var(--grad-primary); border-color: transparent }
input[type=checkbox]:checked::before { left: 22px; width: 24px; height: 24px; background: #05101a }
output { color: var(--accent-ink); font-weight: 800 }
.cal-ring::after { background: var(--bg) }
.cal-ring[data-step="a"] { background: conic-gradient(var(--a) calc(var(--p) * 360deg), var(--track) 0) }
.cal-ring[data-step="b"] { background: conic-gradient(var(--b) calc(var(--p) * 360deg), var(--track) 0) }

/* Onboarding: a dark brand cover with light trails (the brochure's cover), the rest on the light page. */
.onboarding .scroll { padding-top: 16px }
.onb-hero { position: relative; overflow: hidden; background: var(--grad-cover); color: var(--cover-text); border-radius: 32px; padding: 22px 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow-2) }
.onb-hero > * { position: relative }
.onb-hero > .trails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
.onb-hero h1 { color: var(--cover-text); margin: 6px 0 4px }
.onb-hero .lead { color: var(--cover-muted); margin: 0 }
.onb-art { margin: 4px auto 6px }
.onb-art .art { width: 132px; height: 132px; filter: drop-shadow(0 14px 20px rgba(0, 0, 0, .4)); animation: float 4s ease-in-out infinite }
.onb-art.small .art { width: 84px; height: 84px }
.onb-art.scene .art { width: min(230px, 100%); height: auto; aspect-ratio: 5 / 4 }
@keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
.how.onb-card { padding: 14px 16px 14px 34px }
.dots i { background: var(--line-strong); transition: width .25s var(--spring) }
.dots i.on { background: #0aa865; width: 24px }

/* Toasts, tables, PIN, check-in. */
.toast { background: var(--card); color: var(--text); border-left: 5px solid var(--accent); border-radius: 16px; font-weight: 800; box-shadow: var(--shadow-2) }
.toast.good { border-left-color: var(--good) }
.toast.bad { border-left-color: var(--bad) }
table.data thead th { background: var(--bg2) }
td.heat.h1 { background: #fde2e2 } td.heat.h2 { background: #fbc4c4 }
td.heat.h3 { background: #f59a9a } td.heat.h4 { background: #c21b2e; color: #fff }
:root[data-theme="dark"] td.heat.h1 { background: #4a2235 } :root[data-theme="dark"] td.heat.h2 { background: #6e2a3f }
:root[data-theme="dark"] td.heat.h3 { background: #9b3048 }
.pin-art { display: grid; place-items: center; margin: 8px auto }
.pin-art .art { width: 88px; height: 88px }
.pin-input { border-radius: 16px; border: 2px solid var(--line-strong); background: var(--card) }
.checkin-hero { display: flex; align-items: center; gap: 12px; text-align: left }
.tut-canvas { border-radius: 20px }
.showcase-banner .btn { background: #ffd27a }

/* Coach «Мио» next to its advice (5.4) */
.coach-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px }
.coach-head .mio { flex: none }
.rest .mio { display: block; margin: 0 auto 4px }

/* Headings focused on a screen change (for screen readers) need no ring: they are not controls. */
[tabindex="-1"]:focus { outline: none }

/* Settings: foldable sections (5.6) — the whole summary row is the 48 px target */
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 48px }
.fold > summary::-webkit-details-marker { display: none }
.fold > summary h2 { margin: 0 }
.fold > summary::after { content: '▾'; font-size: 1.25rem; color: var(--muted, #9fb0dd); transition: transform .2s }
.fold[open] > summary::after { transform: rotate(180deg) }
.fold[open] > summary { margin-bottom: 8px }
:root.rm .fold > summary::after { transition: none }

/* Landscape phone (5.7, WCAG 1.3.4 «Orientation»: not locked any more — e.g. a phone fixed on a wheelchair mount).
   The play screen puts the field on the left and the signal + pads on the right, so nothing is cut off at 390 px. */
@media (orientation: landscape) and (max-height: 540px) {
  .app { max-width: 1000px }

  .play-screen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 42%) }
  .play-top, .play-progress { grid-column: 1 / -1 }
  .play-screen .stage { min-height: 0 }
  .play-screen .meter { grid-column: 2; grid-row: 3; align-self: end; border-top: 0 }
  .play-screen .controls { grid-column: 2; grid-row: 4; padding-bottom: calc(8px + env(safe-area-inset-bottom)) }

  .play-screen .pads.gestures { grid-template-columns: repeat(2, minmax(0, 1fr)) } /* whole words: «Указательный» */
  .play-screen .gkey { min-height: 48px }
  .sheet { max-width: 640px }
}

/* ===== 5.8 — robust layout «from start to finish» (tests/e2e/layout.mjs: 7 viewports × text 100/130/200 %).
   Android WebView multiplies text by the system font scale (up to 200 % on Android 14+), so sizes that hold
   text are in rem, tracks shrink (minmax(0, …)), long words wrap, nothing relies on a fixed pixel box. ===== */
html { overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto }
small { font-size: max(0.75rem, 0.83em) }
.seg small, .day small, .stats small, .calendar small, .skin small, .xp small { font-size: 0.75rem }

.eyebrow, .play-title h1, .seg, .nav-item, .pad-label span, .bridge-panel small, .legend, .how li, .badge, .stats div { overflow-wrap: anywhere }

/* Radio groups wrap instead of overflowing: «Пропорциональный» does not fit a third of 320 px. */
.segmented { grid-auto-flow: row }

.seg { min-width: 0 }

/* Icon boxes grow with the text they sit next to. */
.hero-top { grid-template-columns: 3.5rem minmax(0, 1fr) auto }
.avatar { width: 3.5rem; height: 3.5rem }
.game-icon { width: 3.25rem; height: 3.25rem; flex: none }
.plan-list li { grid-template-columns: 2.75rem minmax(0, 1fr) }
.plan-icon { width: 2.5rem; height: 2.5rem }
.skill { grid-template-columns: minmax(0, 7rem) minmax(0, 1fr) minmax(2.25rem, auto) }
.skill span { overflow-wrap: anywhere }
.day i { width: min(30px, 100%); aspect-ratio: 1; height: auto }

/* Results: the stars are a picture (the score is text next to them) — sized by the screen, never wider than it. */
.big-stars { letter-spacing: 0.08em }
.big-score { font-size: min(3.25rem, 16vw) }

/* Bottom bar: labels may take two lines at large text; the scroll padding above follows in rem. */
.nav-item { padding: 4px 2px; line-height: 1.15; text-align: center }
.showcase-banner .btn { min-height: 44px }

/* Play: the title column shrinks (the score stays on screen), the stage gives way to the controls on short screens,
   and if text is so large that nothing fits, the screen scrolls instead of cutting the pads off. */
.play-top { grid-template-columns: 48px minmax(0, 1fr) 48px auto }
.play-screen { overflow: hidden auto }
.stage { min-height: 160px }
.play-side { display: contents }

/* Emulator pads: label at the top, value at the bottom — in the flow, so they can never overlap. */
.pad { display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; min-width: 0 }
.pad-label, .pad-value { position: relative; inset: auto; z-index: 1 }
.pad-label { gap: 2px }

.pad-value { align-self: flex-end }
.pads.two { height: auto; min-height: clamp(120px, 22dvh, 190px) }
.pad-co { padding: 4px 8px }
.settings .pads.two, .calibration .pads.two { height: auto; min-height: 120px }
.tutorial .controls .pads.two { height: auto; min-height: 130px }
.controls.compact .pads.two { height: auto; min-height: 96px }

@media (orientation: landscape) and (max-height: 540px) {

  .play-screen .play-side { display: flex; flex-direction: column;                            min-height: 0; overflow-y: auto }
  .play-screen .pads.two { height: auto; min-height: clamp(120px, 46dvh, 220px) }
}

/* 5.8 — second pass of the layout audit. */
.top-bar { grid-template-columns: 52px minmax(0, 1fr) 52px }
.top-bar h1 { overflow-wrap: anywhere }
.bottom-nav { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.level-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 4.25rem), 1fr)) }
.skins { grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)) }
.skin { min-width: 0 }
.skin canvas { max-width: 100%; height: auto }
.table-wrap { overflow-x: auto; margin: 6px 0; border-radius: 10px }
.table-wrap:focus-visible { outline-offset: 0 }
table.data { margin: 0 }

.row input[type=text], .row input[type=url], .row input[type=time] { width: 100%; min-width: 0 }
.row > span { flex-wrap: wrap }
.pin-input { width: min(10ch, 100%) }
.showcase-banner { flex-wrap: wrap }

/* The game hint is a bar under the field (5.8): over the canvas it hid what games draw at the bottom and, on a short
   screen with large text, climbed over the header. Two lines are reserved so the layout does not jump. */
.stage-hint { position: static; margin: 0; border-radius: 0; background: var(--card); border-top: 1px solid var(--line);                                 display: grid; place-items: center }
.play-side > :first-child { margin-top: auto } /* landscape column: overflow scrolls instead of escaping upwards */

/* Short landscape screens: sticky footers would cover half of the page — they scroll with it. */
@media (max-height: 540px) and (orientation: landscape) {
  .sticky-actions { position: static; background: none }
  .play-screen { grid-template-rows: auto 4px minmax(0, 1fr) auto }
  .play-screen .stage { grid-column: 1; grid-row: 3 }
  .play-screen .stage-hint { grid-column: 1; grid-row: 4 }
  .play-screen .play-side { grid-column: 2; grid-row: 3 / 5 }
}
/* Only the field shrinks; the hint, the signal and the pads keep their content height. */
.play-screen > .stage-hint, .play-screen .meter, .play-screen .controls { flex: none }
/* A pad narrower than 6.5 rem keeps «A»/«B» and the value; the word under the letter would break mid-word. */
.pad { container-type: inline-size }
@container (max-width: 6.5rem) { .pad-label span { display: none } }
.row input:not([type=checkbox]):not([type=range]):not([type=file]) { min-height: 48px }
/* 5.8 — third pass. */
@media (orientation: landscape) and (max-height: 540px) {
  /* flex-end with overflow pushed the signal above the column; margin-top: auto aligns down only when it fits */
  .play-screen .play-side { justify-content: normal }
  .play-screen .play-side .meter { align-self: stretch }
  .play-screen { overflow: hidden auto }
  /* A compact bottom bar: icon and label in a row, 48 px — a third of a 320 px high screen is too much. */

  .nav-item .nav-icon { padding: 2px 10px }

}
html { scroll-padding-bottom: var(--nav-space, calc(64px + 2rem)) }
.scroll { padding-bottom: calc(var(--nav-space, calc(64px + 2rem)) + 2rem) }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center }
.nav-label { max-width: 100%; overflow-wrap: anywhere }
.fold > summary h2 { min-width: 0; overflow-wrap: anywhere }
.row.toggle { min-height: 48px }
/* Pad letters and values follow the pad width (container units) as well as the text size. */
.pad-label b { line-height: 1.25 }
.pad-value { line-height: 1.25; max-width: 100% }
.pad { gap: 2px }
.pads.two { grid-template-columns: minmax(0, 1fr) minmax(2.75rem, 0.55fr) minmax(0, 1fr) }
.pad-label b { font-size: max(12px, min(1.75rem, 40cqi)) }
.pad-value { font-size: max(12px, min(1.125rem, 26cqi)) }
html { scroll-padding-top: calc(3rem + 24px) } /* sticky top bar / showcase banner */
.showcase-banner small { font-size: inherit }
@media (max-width: 380px) { .showcase-banner small { display: none } }
/* Landscape: the field takes the whole left side; the hint sits on top of the right column (5.8). */
@media (orientation: landscape) and (max-height: 540px) {
  .play-screen { grid-template-rows: auto 4px auto minmax(0, 1fr) }
  .play-screen .stage { grid-column: 1; grid-row: 3 / 5 }
  .play-screen .stage-hint { grid-column: 2; grid-row: 3; border-top: 0; border-bottom: 1px solid var(--line) }
  .play-screen .play-side { grid-column: 2; grid-row: 4 }
}
.big-stars { font-size: min(4rem, 20vw, 26vh); overflow-wrap: anywhere }
/* SVG line icons (5.8) instead of platform emoji. */
.ico { width: 1.5rem; height: 1.5rem; display: block }
.icon-btn { display: inline-grid; place-items: center }
.nav-icon .ico { width: 1.375rem; height: 1.375rem }
.pad:focus-visible, .gkey:focus-visible, .pad-co:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
:root .showcase-banner small, :root.hc .showcase-banner small { color: inherit }
.plan .plan-start { margin: 4px 0 12px }
.plan .plan-list { margin-bottom: 0 }

/* Windows high contrast (forced colors, 5.9): backgrounds are replaced by system colours — state must not rely on them. */
@media (forced-colors: active) {
  .seg.active, .nav-item.active, .level.rec, .skin.active, .pad.on, .gkey.on, .pad-co.on { outline: 3px solid Highlight; outline-offset: -3px }
  .meter-bar .fill, .pad-fill, .xp-track i, .skill-track i, .play-progress i, .day.done i, .confirm-ring, .cal-ring { forced-color-adjust: none }
  .btn, .seg, .card, .pad, .gkey { border: 1px solid CanvasText }
  /* The drawn switch is a native checkbox again: system colours draw its state (5.12). */
  input[type=checkbox] { appearance: auto; -webkit-appearance: auto; width: 28px; height: 28px; border: 0; background: none }
  input[type=checkbox]::before { display: none }
  .hero > .trails, .onb-hero > .trails, .game-card::after, .tinted::after, .g-check.card::after, .tutorial-card.card::after { display: none }
}

/* ===== 5.9 — words are never split mid-word at the default text size on a phone ≥ 360 px (layout linter «broken»;
   the screenshot showed «Пропорциональны / й»). `overflow-wrap: anywhere` stays as the last resort for 200 % text. */
/* The longest word of a group (`--word`, letters; segmented() and createGesturePads() set it) sets the narrowest
   column: «Пропорциональный» stacks the options on a phone, «Правая рука / Левая рука» stay side by side.
   Measured: bold 14 px Cyrillic ≈ 0.56 rem per letter; + padding. */
.segmented { grid-template-columns: repeat(auto-fit, minmax(min(100%, max(5.75rem, calc(var(--word, 0) * 0.56rem + 1.25rem))), 1fr)) } /* 5.12: three short options in a row */
.checkin .segmented { grid-template-columns: repeat(auto-fit, minmax(min(100%, max(8rem, calc(var(--word, 0) * 0.56rem + 1.25rem))), 1fr)) }
/* Gesture pads: icon + name; never fewer than two columns (seven pads in one column would push the field away).
   bold 13 px ≈ 0.52 rem per letter + icon 36 px + gaps and padding. */
.pads.gestures { grid-template-columns: repeat(auto-fit, minmax(min(calc(50% - 4px), max(6rem, calc(var(--word, 0) * 0.52rem + 3.75rem))), 1fr)) }
.gkey { min-height: 3.5rem; overflow-wrap: normal }
.gkey span { overflow-wrap: anywhere } /* last resort at 320 px or 200 % text */
/* Number tiles: 2 × 2 on a phone — «упражнений», «выполнение, мс» and «2310» do not fit a quarter of 360 px. */
.stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
@media (min-width: 480px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
/* Achievements: «Переключатель» is 129 px in bold 16 px, half of a 360 px card gives 121. */
.badge b { font-size: 0.875rem }
/* Tables: columns take whole words; a table wider than the card scrolls in its own named region (WCAG 1.4.10 lets
   data tables scroll in two dimensions) instead of breaking «Усталость» into «Устало / сть». */
table.data { table-layout: auto }
table.data th, table.data td { overflow-wrap: normal; hyphens: manual; padding: 4px }
table.data th { font-size: 0.75rem }
/* «A+B» is one symbol for the player: it shrinks with the pad, never wraps. */
.pad-co { container-type: inline-size }
.pad-co span { white-space: nowrap; font-size: max(12px, min(1rem, 30cqi)) }
/* A gesture pad narrower than icon + name (landscape column, 320 px): the icon goes above the name. */
.gkey { container-type: inline-size }
@container (max-width: 8.5rem) { /* content box: icon 36 + gap 4 + «Указательный» 94 px */
  .gkey > * { grid-column: 1 / -1; justify-self: center; text-align: center }
}
@media (max-width: 479px) { .stats > :last-child:nth-child(odd) { grid-column: 1 / -1 } } /* 5 tiles: 2 + 2 + 1 wide */
/* The radar spans the card including its padding: the side labels need the room more than a margin (5.9). */
.radar { margin: 0 -16px; max-width: calc(100% + 32px) }

/* ===== 5.10 — what the player presses is always on screen (layout linter «reach» and «action»). ===== */
/* Screens driven by the pads («Первые шаги», calibration): the step scrolls in the middle, the signal and the pads
   are docked at the bottom — in landscape on the right, like the game. */
.frame { height: 100dvh; min-height: 0 }
.frame > .frame-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px }
.frame > .frame-dock { flex: none }
.frame .tut-canvas { width: auto; max-width: 100%; height: clamp(110px, 28dvh, 240px) }
.frame .tut-ring { width: clamp(40px, 8dvh, 64px); height: clamp(40px, 8dvh, 64px) }
.frame .row-actions { margin-top: 8px }
@media (orientation: landscape) and (max-height: 540px) {
  .frame { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 42%); grid-template-rows: auto minmax(0, 1fr) }
  .frame > .top-bar { grid-column: 1 / -1 }
  .frame > .frame-body { grid-column: 1; grid-row: 2 }
  .frame > .frame-dock { grid-column: 2; grid-row: 2; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; border-left: 1px solid var(--line) }
  .frame > .frame-dock > :first-child { margin-top: auto } /* down when it fits, scrolls when it does not (C.1.38) */
  .frame .tut-canvas { height: clamp(90px, 30dvh, 200px) }
}
/* Demo profile: the banner takes its height from a full-height screen instead of pushing its bottom (the pads)
   off the screen — the mode used to present the game to the jury. */
.app:has(> .showcase-banner):has(> .play-screen, > .frame) { height: 100dvh; display: flex; flex-direction: column }
.app:has(> .showcase-banner) > .play-screen, .app:has(> .showcase-banner) > .frame { height: auto; flex: 1; min-height: 0 }
/* Dialog sheets scroll, their actions do not: «Старт» stays visible on any phone (it was scrolled out of sight). */
.sheet-actions { position: sticky; bottom: -18px; margin: 12px -18px -18px; padding: 10px 18px 18px; background: inherit; border-top: 1px solid var(--line); z-index: 1 }
.sheet-actions .confirm { margin: 0 0 8px }
/* Game dialogs (intro, pause) cover everything under the header — the field, the hint, the signal and the pads. */
.play-screen { position: relative }
.play-screen > .overlay { top: var(--play-top, 60px); z-index: 4 }
/* 200 % text on a small phone: the dock alone can be taller than the screen — then the whole frame scrolls,
   and the step keeps a readable minimum instead of collapsing to nothing. */
.frame { overflow: hidden auto }
.frame > .frame-body { min-height: min(14rem, 45dvh) }
/* Demo banner in landscape: the pads give up a little height so the column still fits (5.10). */
@media (orientation: landscape) and (max-height: 540px) { .app:has(> .showcase-banner) .play-screen .pads.two { min-height: clamp(110px, 38dvh, 220px) } }
/* Rewards of a run (5.10): on the screen, not in toasts over the score. */
.rewards { list-style: none; margin: 4px auto 10px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px }
.rewards li { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--warn); border-radius: 99px; padding: 5px 12px 5px 6px; font-size: 0.875rem; font-weight: 800; box-shadow: var(--shadow-1) }
.rewards li .art { width: 1.5rem; height: 1.5rem }

/* 5.11 — «Синхронизация звука»: the dot reaches the line on every click (transform only: no layout per frame). */
.sync-stage { position: relative; height: 10rem; margin: 1rem 0; border-radius: 16px; background: var(--card); border: 1px solid var(--line); overflow: hidden }
.sync-dot { position: absolute; top: 0; left: calc(50% - 1rem); width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent); transform: translateY(calc(var(--y, 0) * 7rem)) }
.sync-line { position: absolute; left: 10%; right: 10%; top: 9rem; height: 4px; border-radius: 2px; background: var(--muted) }
.sync-line.hit { background: var(--good) }
.sync-value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums }
/* 5.11 — 320 px high landscape (568×320): the hint on top of the right column pushed the pads off the screen
   (full layout audit of 5.10: `reach` in 5 states — a long intro hint, the bridge status, high contrast, 7 gestures).
   On such screens the hint goes under the field, and the right column holds only the signal and the pads. */
@media (orientation: landscape) and (max-height: 400px) {
  .play-screen { grid-template-rows: auto 4px minmax(0, 1fr) auto }
  .play-screen .stage { grid-column: 1; grid-row: 3 }
  .play-screen .stage-hint { grid-column: 1; grid-row: 4; border-top: 1px solid var(--line); border-bottom: 0; min-height: calc(1.45em + 12px) }
  .play-screen .play-side { grid-column: 2; grid-row: 3 / 5 }
  .play-screen .gkey, .frame .gkey { min-height: 44px }
  .play-screen .pads.gestures, .frame .pads.gestures { gap: 4px }
  .frame .pads.gestures { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
/* 5.11 — design review. Warning cards look like warnings (the later `.card` border used to win). */
.card.warn-card { border: 1.5px solid var(--warn); background: var(--tint-yellow) }
.warn-card > b { color: var(--warn-ink) }
:root.hc .card.warn-card { border-color: #ffe14d; background: #000 }
/* Home hero on 320–380 px: the greeting keeps whole words, the series goes under it instead of squeezing it. */
.hero h1, .hero .eyebrow { overflow-wrap: anywhere } /* 5.12: whole words when they fit; Unbounded at 200 % text on 320–360 px breaks rather than overflows */
.hero h1 { font-size: clamp(1.25rem, 6.4vw, 1.625rem) } /* Unbounded (5.12) is wider than the system font */
@media (max-width: 380px) {
  .hero-top { grid-template-columns: 3.5rem minmax(0, 1fr) }
  .hero-top .streak { grid-column: 2; justify-self: start }
}
/* Short portrait phones (568 px, iPhone SE 1st gen): the day's first action stays above the bar in high contrast too. */
@media (orientation: portrait) and (max-height: 600px) {
  .hero { padding: 14px 14px 12px }
  .hero-top { gap: 8px }
  .week { margin-top: 8px }
}
/* 5.11 — landscape phone (a wheelchair holder): a navigation rail on the left (Material 3) instead of a bar over a
   third of a 390 px high screen, and every screen's main action stays on screen in one compact sticky row (it was
   static there — «Дальше», «Играть», «Начать» were below the edge). */
@media (orientation: landscape) and (max-height: 540px) {
  .bottom-nav { top: 0; bottom: 0; left: 0; transform: none; width: calc(84px + env(safe-area-inset-left)); max-width: none; grid-template-columns: 1fr; grid-auto-rows: min-content; align-content: center; gap: 4px;
    border: 0; border-right: 1px solid var(--line); border-radius: 0; box-shadow: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left) }
  .nav-item { flex-direction: column; min-height: 64px; gap: 2px }
  .screen:has(> .bottom-nav) { padding-left: calc(88px + env(safe-area-inset-left)) }
  :root { --nav-space: 0px }
  .sticky-actions { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 6px) }
  /* basis in vw, not rem: at 200 % text a 12 rem basis put every button on its own row and the bar covered the page */
  .sticky-actions > .btn { flex: 1 1 28vw; margin: 0; min-height: 48px; padding-block: 6px }
  .sticky-actions .btn.big { min-height: 52px }
  .app:has(> .screen > .bottom-nav) > .showcase-banner { padding-left: calc(88px + env(safe-area-inset-left)) }
}
:root.hc .bottom-nav { border-radius: 0 }
/* 5.11 — two lines of the game hint fit the reserve exactly (border included): a 1 px jump resized the canvas. */
.stage-hint { min-height: calc(2.9em + 14px); line-height: 1.45 }
/* 5.11 — design review, second part. Unselected options look tappable; the game grid has no lonely cell. */
.seg:not(.active) { background: var(--card); box-shadow: inset 0 0 0 1px var(--line) }
:root.hc .seg:not(.active) { background: #000; box-shadow: inset 0 0 0 2px #fff }
.game-card:last-child:nth-child(even) { grid-column: 1 / -1; min-height: 150px } /* the first card spans the row: an even last one would stand alone */
/* Seven gesture pads on a short phone (320×568): three columns, the field keeps room for the hand. */
@media (max-height: 640px) and (orientation: portrait) {
  .play-screen .pads.gestures { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .play-screen .gkey { min-height: 48px; grid-template-columns: 1fr; justify-items: center }
  .play-screen .gkey .gesture-icon { display: none }
  .play-screen .pads-note { display: none }
}
/* 320 px with 200 % text: a split inside a word is the lesser evil than text past the edge (the linter's rule). */
@media (max-width: 359px) { .hero h1, .btn { overflow-wrap: anywhere } }

/* Жар-птица (5.12): the nest card — a dark brand cover with the glowing bird, the progress to the next stage. */
.pet-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; background: var(--grad-cover); color: var(--cover-text); border-color: transparent; position: relative; overflow: hidden }
.pet-card .pet-art .art { width: 96px; height: 96px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)) }
.pet-card h2 { color: var(--cover-text); font-family: var(--font-display); font-size: 1.25rem; margin: 2px 0 6px }
.pet-card .eyebrow { color: var(--cover-muted) }
.pet-card small { color: var(--cover-muted) }
.pet-card .xp-track { background: #1b2a37; margin: 2px 0 4px }
.pet-progress small { display: block; font-size: 0.8125rem }
@media (max-width: 359px) { .pet-card { grid-template-columns: 1fr } }
/* The bird's path: a vertical journey with a rail through the stage nodes (Finch / Duolingo-like), any text size. */
.pet-path { list-style: none; margin: 0; padding: 0; display: grid }
.pet-path li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 12px 6px 6px; border-radius: 20px; position: relative }
.pet-path li::before { content: ""; position: absolute; left: 33px; top: 0; bottom: 0; width: 2px; background: var(--line-strong) }
.pet-path li:first-child::before { top: 50% }
.pet-path li:last-child::before { bottom: 50% }
.pet-path li.done::before, .pet-path li.now::before { background: var(--accent) }
.pet-path li.now::before { bottom: 50% }
.pet-path li.now:first-child::before { display: none }
.pet-path li.now:not(:last-child)::after { content: ""; position: absolute; left: 33px; top: 50%; bottom: 0; width: 2px; background: var(--line-strong) }
.pet-path .pet-node { position: relative; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--card2); box-shadow: 0 0 0 2px var(--line-strong) }
.pet-path li.done .pet-node, .pet-path li.now .pet-node { background: var(--tint-green); box-shadow: 0 0 0 2px var(--accent) }
.pet-path li.now { background: var(--tint-green) }
.pet-path li.next .art { filter: grayscale(1) opacity(.45) }
.pet-path b { display: block; line-height: 1.25 }
.pet-path small { display: block; color: var(--muted); font-size: 0.875rem }
.pet-path li.now small { color: var(--accent-ink); font-weight: 700 }
.pet-promise { color: var(--text) }


/* ===== 5.13 — the living Firebird, its things, goals and hint tours (ideas of the team's sample ФинФениксы).
   Motion: short one-shots and an idle that stops by itself within 5 s (WCAG 2.2.2); all of it off with .rm and
   prefers-reduced-motion (the rules at the end of the file). No flashes: the «evolve» glow changes slowly. ===== */
.pet-card .pet-art { display: grid; place-items: center; padding: 0; margin: 0; border: 0; background: transparent; border-radius: 24px; cursor: pointer; min-width: 48px; min-height: 48px; color: inherit }
.pet-card .pet-art:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.pet-card .pet-art .art { width: 104px; height: 104px }
.pet-say { position: relative; margin: 10px 0 0; padding: 8px 12px; border-radius: 16px; background: #ffffff; color: #05101a; font-size: 0.875rem; font-weight: 600; line-height: 1.4 }
.pet-say::before { content: ""; position: absolute; left: -7px; top: 14px; border: 7px solid transparent; border-left: 0; border-right-color: #ffffff }
@media (max-width: 359px) { .pet-say::before { left: 24px; top: -7px; border: 7px solid transparent; border-top: 0; border-bottom-color: #ffffff } }
.pet-goal { grid-column: 1 / -1; display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .18) }
.pet-goal p { margin: 0; color: var(--cover-muted) }
.pet-goal b { color: var(--cover-text) }
.pet-goal .btn { justify-self: start }
.pet-moment { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; background: var(--grad-cover); color: var(--cover-text); border-color: transparent; text-align: left }
.pet-moment .art { width: 96px; height: 96px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)) }
.pet-moment p { margin: 0 }
.outfit-preview { display: grid; place-items: center; margin: 4px 0 8px; padding: 8px; border-radius: 22px; background: var(--grad-cover) }
.outfit-preview .art { width: 128px; height: 128px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)) }
.outfit-slot { margin: 10px 0 }
.outfit-label { margin: 0 0 6px; font-weight: 800 }
.outfit-slot .note { margin: 0 }
.goal-intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; background: var(--grad-cover); color: var(--cover-text); border-color: transparent }
.goal-intro p { margin: 0 }
.goal h2, .goal h3 { margin: 2px 0 6px; font-size: 1.0625rem }
.goal.active { border: 2px solid var(--accent) }
.goal .xp-track { margin: 6px 0 4px }
.goal small { display: block; color: var(--muted); margin-bottom: 10px }
.goal .note { margin: 0 0 8px }
@media (max-width: 359px) { .pet-moment, .goal-intro { grid-template-columns: 1fr; justify-items: center; text-align: center } }

/* The bird moves as one group from its feet; the eyes blink from their middle; the tail sways from its base. */
.firebird .fb-bird, .firebird .fb-eyes, .firebird .fb-tail { transform-box: fill-box }
.firebird .fb-bird { transform-origin: 50% 100% }
.firebird .fb-eyes { transform-origin: 50% 50% }
.firebird .fb-tail { transform-origin: 50% 100% }
.firebird.alive .fb-bird { animation: fb-breathe 2.4s ease-in-out 2 }
.firebird-fed.alive .fb-bird { animation: fb-bounce 1.6s ease-in-out 3 }
.firebird-rest.alive .fb-bird, .firebird.anim-sleep .fb-bird { animation: fb-sleep 4.4s ease-in-out 1 }
.firebird.alive .fb-eyes { animation: fb-blink 2.4s ease-in-out 2 }
.firebird.alive .fb-tail { animation: fb-sway 2.4s ease-in-out 2 }
.firebird.anim-hop .fb-bird { animation: fb-hop .6s cubic-bezier(.3, .7, .4, 1) 1 }
.firebird.anim-wave .fb-bird { animation: fb-wave .8s ease-in-out 1 }
.firebird.anim-celebrate .fb-bird { animation: fb-hop .55s cubic-bezier(.3, .7, .4, 1) 2 }
.firebird.anim-celebrate .fb-tail { animation: fb-sway .55s ease-in-out 2 }
.firebird.anim-evolve .fb-bird { animation: fb-evolve 1.4s cubic-bezier(.2, .8, .3, 1.2) 1 }
.firebird.anim-evolve { animation: fb-warm 1.4s ease-out 1 }
@keyframes fb-breathe { 0%, 100% { transform: none } 50% { transform: translateY(-1.5px) scaleY(1.02) } }
@keyframes fb-bounce { 0%, 100% { transform: none } 40% { transform: translateY(-3px) scaleY(1.03) } 70% { transform: translateY(0) scaleY(.98) } }
@keyframes fb-sleep { 0%, 100% { transform: none } 50% { transform: scaleY(.97) scaleX(1.02) } }
@keyframes fb-blink { 0%, 44%, 52%, 100% { transform: none } 48% { transform: scaleY(.1) } }
@keyframes fb-sway { 0%, 100% { transform: none } 30% { transform: rotate(-2.5deg) } 70% { transform: rotate(2.5deg) } }
@keyframes fb-hop { 0%, 100% { transform: none } 30% { transform: translateY(-9px) scale(.97, 1.04) } 60% { transform: translateY(0) scale(1.04, .95) } 80% { transform: scale(.99, 1.01) } }
@keyframes fb-wave { 0%, 100% { transform: none } 25% { transform: rotate(-6deg) } 50% { transform: rotate(5deg) } 75% { transform: rotate(-3deg) } }
@keyframes fb-evolve { 0% { transform: scale(.55); opacity: .2 } 60% { transform: scale(1.08); opacity: 1 } 100% { transform: none } }
@keyframes fb-warm { 0% { filter: drop-shadow(0 0 0 rgba(255, 210, 122, 0)) } 50% { filter: drop-shadow(0 0 14px rgba(255, 210, 122, .85)) } 100% { filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)) } }

/* Hint tours: a card above the bottom bar (beside the rail in landscape) and a ring around the element it explains. */
.tour { position: fixed; z-index: 25; left: 12px; right: 12px; bottom: 96px; max-width: 520px; margin: 0 auto; max-height: 48vh; display: flex; flex-direction: column;
  background: var(--card); color: var(--text); border: 2px solid var(--accent); border-radius: 24px; padding: 14px 16px 12px; box-shadow: var(--shadow-2); animation: rise .25s ease }
/* The text scrolls inside the card, the buttons stay (a 390 px high landscape screen at 200 % text). */
.tour-text { overflow: auto; min-height: 0; flex: 1 1 auto }
.tour-count { margin: 0; color: var(--muted); font-size: 0.8125rem; font-weight: 700 }
.tour h2 { margin: 2px 0 6px; font-size: 1.125rem }
.tour p.tour-body { margin: 0 0 10px }
.tour .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; flex: 0 0 auto }
.tour .row-actions .btn { flex: 1 1 9rem; margin: 0 }
.tour-target { outline: 3px solid var(--accent) !important; outline-offset: 4px; box-shadow: 0 0 0 9px var(--deco-green, rgba(22, 225, 130, .25)) !important; scroll-margin-top: 72px; animation: tour-ring 1.6s ease-in-out 3 }
@keyframes tour-ring { 0%, 100% { outline-offset: 4px } 50% { outline-offset: 7px } }
/* Short screens (a 568 × 320 phone in landscape): a smaller card and the explained element right under the top (or the
   demo banner), so both are on screen at once — the full layout run found the card over the element. */
@media (max-height: 540px) { .tour { max-height: 40vh; padding: 10px 12px 8px } .tour h2 { margin: 0 0 4px } .tour-target { scroll-margin-top: 52px } }
/* The demo banner above a game screen: the screen takes the height that is left, not the whole viewport. Found once the
   demo profile kept the person's gesture scheme (5.13): «Ключ» was below a 568 × 320 screen under the banner. */
.app:has(> .showcase-banner):has(> .play-screen) { height: 100dvh; min-height: 0; display: flex; flex-direction: column }
.app:has(> .showcase-banner) > .play-screen { height: auto; flex: 1 1 0; min-height: 0 }
/* …and on a short landscape game screen there is no room for the banner and six gesture pads: the pads win («что нажимать —
   всегда на экране», 5.10); every other screen of the demo still shows the banner. */
@media (orientation: landscape) and (max-height: 540px) { .app:has(> .play-screen) > .showcase-banner { display: none } }
:root.hc .tour { background: #000; border-color: #ffe14d }
:root.hc .tour-target { outline-color: #ffe14d !important; box-shadow: none !important }
:root.hc .pet-say { background: #000; color: #fff; border: 2px solid #fff }
:root.hc .pet-say::before { display: none }
:root.hc .pet-moment, :root.hc .goal-intro, :root.hc .outfit-preview { background: #000; color: #fff; border: 2px solid var(--line); box-shadow: none }
@media (forced-colors: active) { .tour-target { outline: 3px solid Highlight !important } .tour { border-color: Highlight } }

/* ===== Modes: high contrast and reduced motion always win over decoration ===== */
:root.hc body { background: #000 }
:root.hc .card, :root.hc .btn, :root.hc .seg, :root.hc .level, :root.hc .pad, :root.hc .gkey, :root.hc .badge, :root.hc .sheet,
:root.hc .plan-list li, :root.hc .skin, :root.hc .legend, :root.hc .pad-label, :root.hc .pad-value, :root.hc .rewards li { border: 2px solid var(--line) }
:root.hc .hero, :root.hc .onb-hero, :root.hc .game-card, :root.hc .g-check.card, :root.hc .tutorial-card.card, :root.hc .celebrate, :root.hc .tinted,
:root.hc .card.warn-card, :root.hc .tip.card, :root.hc .coach.card, :root.hc .game-hero, :root.hc .plan-icon, :root.hc .sheet-title .tile, :root.hc .sec-ico,
:root.hc .stats div, :root.hc .pet-card { background: #000; color: #fff; border: 2px solid var(--line); box-shadow: none }
:root.hc .hero > .trails, :root.hc .onb-hero > .trails, :root.hc .game-card::after, :root.hc .tinted::after, :root.hc .g-check.card::after, :root.hc .tutorial-card.card::after { display: none }
:root.hc .btn.primary, :root.hc .seg.active, :root.hc .level.rec, :root.hc .nav-item.active .nav-icon { background: #ffe14d; color: #000; box-shadow: none }
:root.hc .avatar, :root.hc .streak, :root.hc .game-icon { background: #000; color: #fff; border: 2px solid #fff; box-shadow: none }
:root.hc .hero .xp-track i, :root.hc .day.done i { background: #3fe0a0; border-color: #3fe0a0 }
:root.hc .day.today i { box-shadow: none }
:root.hc .note, :root.hc small { color: var(--muted) }
:root.hc .eyebrow { color: #ffe14d }
:root.hc .card.warn-card { border-color: #ffe14d; background: #000 }
:root.hc .bottom-nav { background: #000; border: 2px solid #fff }
:root.hc .breath { background: #ffe14d; box-shadow: none }
:root.hc .big-stars .art { filter: none }
:root.hc .level.rec .star-row { color: #555 }
:root.hc .scroll > h1::after { background: #ffe14d }
:root.rm *, :root.rm *::before, :root.rm *::after { animation: none !important; transition: none !important }
