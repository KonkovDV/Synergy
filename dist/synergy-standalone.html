<style>/* Синергия — mobile-first, one-handed, high-contrast dark UI.
   Solid surfaces (no translucency behind text), ≥48px targets, primary actions in the thumb zone. */
:root {
  --bg: #0d1530; --bg2: #121c3d; --card: #17234b; --card2: #1d2b5a; --line: #2c3d73;
  --text: #f2f5ff; --muted: #a9b8e3; --accent: #5ad1ff; --a: #ffb547; --b: #5ad1ff;
  --good: #3fe0a0; --warn: #ffcc4d; --bad: #ff6b6b; --violet: #9b7bff;
  --radius: 18px; --tap: 52px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--text-scale, 1)); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font: 1rem/1.45 var(--font); }
body { overscroll-behavior: none; }
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; }
h1 { font-size: 1.625rem; line-height: 1.15; margin: 4px 0 8px; letter-spacing: -0.3px; }
h2 { font-size: 1.125rem; margin: 0 0 10px; }
p { margin: 8px 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen { display: flex; flex-direction: column; min-height: 100dvh; }
.scroll { flex: 1; padding: 16px 16px 120px; }
.scroll.center { text-align: center; }
.eyebrow { font-size: 0.8125rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin: 0; }
.note { font-size: 0.875rem; color: var(--muted); }
.note.warn { color: var(--warn); }
.lead { font-size: 1.188rem; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 14px 0; text-align: left; }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.pill { background: var(--card2); border-radius: 99px; padding: 2px 10px; font-weight: 700; font-size: 0.875rem; }

.btn { min-height: var(--tap); border-radius: 16px; border: 1px solid var(--line); background: var(--card2); padding: 12px 18px; font-weight: 700; cursor: pointer; transition: transform .12s ease, filter .12s ease; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: #06122e; border-color: transparent; }
.btn.big { width: 100%; font-size: 1.125rem; min-height: 60px; }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { min-width: 48px; min-height: 48px; border: 0; background: transparent; font-size: 1.375rem; cursor: pointer; border-radius: 14px; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.row-actions .btn { flex: 1; }
.row-actions.col { flex-direction: column; }
.sticky-actions { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); display: grid; gap: 8px; }

/* Bottom navigation (thumb zone). */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.nav-item { min-height: 62px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 1.25rem; line-height: 1; }

.top-bar { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 8px; position: sticky; top: 0; background: var(--bg); z-index: 3; }
.top-bar h1 { font-size: 1.188rem; text-align: center; margin: 0; }

/* Home. */
.hero { background: linear-gradient(160deg, #1d2d66, #2a1f5c); border-radius: 24px; padding: 16px; }
.hero-top { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; }
.hero h1 { margin: 0; }
.avatar { width: 56px; height: 56px; border-radius: 18px; background: var(--card2); display: grid; place-items: center; overflow: hidden; }
.avatar canvas { width: 44px; height: 44px; }
.streak { display: flex; align-items: center; gap: 4px; background: rgba(255,181,71,.15); color: var(--a); border-radius: 99px; padding: 6px 12px; font-size: 1.125rem; }
.xp { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 14px 0 6px; font-size: 0.875rem; font-weight: 600; }
.xp small { color: var(--muted); }
.xp-track, .skill-track { height: 10px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
.xp-track i, .skill-track i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; text-align: center; }
.day i { display: block; width: 26px; height: 26px; margin: 0 auto 2px; border-radius: 50%; border: 2px solid var(--line); }
.day.done i { background: var(--good); border-color: var(--good); }
.day.today i { border-color: var(--accent); }
.day small { color: var(--muted); font-size: 0.6875rem; }
.week-note { grid-column: 1 / -1; margin: 6px 0 0; font-size: 0.8125rem; color: var(--muted); }
.plan-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.plan-list li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; background: var(--card2); border-radius: 14px; padding: 8px 10px; }
.plan-list li.done { opacity: .6; }
.plan-list small { display: block; color: var(--muted); font-size: 0.8125rem; }
.plan-icon { font-size: 1.5rem; text-align: center; }
.tip p { margin: 4px 0 0; color: var(--muted); }
.games h2 { margin-top: 18px; }
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.game-card { text-align: left; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--card); min-height: 150px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.game-card:active { transform: scale(.98); }
.game-card small { color: var(--muted); font-size: 0.8125rem; flex: 1; }
.game-icon { font-size: 1.875rem; }
.game-meta { font-size: 0.75rem; color: var(--warn); font-weight: 700; }
.g-grip { background: linear-gradient(160deg, #1f2f63, #17234b); }
.g-flight { background: linear-gradient(160deg, #2b2668, #17234b); }
.g-rhythm { background: linear-gradient(160deg, #3a1f5f, #17234b); }
.g-safe { background: linear-gradient(160deg, #173f57, #17234b); }

/* Levels. */
.game-hero { font-size: 3rem; margin: 0; text-align: center; }
.how { padding-left: 20px; margin: 8px 0; text-align: left; }
.how li { margin: 4px 0; }
.level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.level { aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer; }
.level b { font-size: 1.375rem; }
.level small { color: var(--warn); letter-spacing: 1px; }
.level.rec { border: 2px solid var(--accent); }
.level.locked { opacity: .45; }

/* Play. */
.play-screen { height: 100dvh; min-height: 0; overflow: hidden; }
.play-top { display: grid; grid-template-columns: 48px 1fr 48px auto; align-items: center; gap: 4px; padding: 4px 8px; }
.play-title b { display: block; font-size: 0.9375rem; }
.play-title small { color: var(--warn); font-size: 0.75rem; font-weight: 700; }
.score { font-size: 1.375rem; min-width: 48px; text-align: right; padding-right: 6px; }
.play-progress { height: 4px; background: rgba(255,255,255,.08); }
.play-progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.stage { position: relative; flex: 1; min-height: 200px; }
.stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage-hint { position: absolute; left: 12px; right: 12px; bottom: 8px; margin: 0; text-align: center; font-size: 0.875rem; font-weight: 600; color: var(--text); background: rgba(13,21,48,.85); border-radius: 12px; padding: 6px 10px; pointer-events: none; }
.play-screen.lost .stage-hint { background: var(--bad); color: #fff; }
.overlay { position: absolute; inset: 0; background: rgba(8,12,30,.78); display: grid; place-items: end center; padding: 12px; overflow: auto; }
.overlay[hidden] { display: none; }
.sheet { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; max-height: 100%; overflow: auto; animation: rise .25s cubic-bezier(.2,.9,.3,1.15); }
.sheet.small { max-width: 420px; }
.sheet h2 { font-size: 1.375rem; }
.legend { font-size: 0.8125rem; color: var(--muted); background: var(--card2); border-radius: 12px; padding: 8px 10px; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

.confirm { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 0.8125rem; color: var(--muted); margin: 10px 0; }
.confirm-ring, .cal-ring { --p: 0; width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(var(--a) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); flex: none; position: relative; }
.confirm-ring::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--card); }

/* Signal meter. */
.meter { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 6px 10px; background: var(--bg2); border-top: 1px solid var(--line); }
.meter-row { display: flex; align-items: center; gap: 6px; }
.meter-label { font-weight: 800; width: 16px; text-align: center; }
.meter-label.a { color: var(--a); } .meter-label.b { color: var(--b); }
.meter-bar { position: relative; flex: 1; height: 14px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
.meter-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; }
.meter-bar.a .fill { background: var(--a); } .meter-bar.b .fill { background: var(--b); }
.meter-bar.b { transform: scaleX(-1); }
.mark { position: absolute; top: 0; bottom: 0; width: 2px; }
.mark.on { background: #fff; opacity: .7; }
.mark.co { background: var(--violet); }
.meter-chip { min-width: 104px; text-align: center; font-weight: 800; font-size: 0.8125rem; border-radius: 99px; padding: 4px 10px; background: var(--card2); }
.meter-chip[data-cmd="close"] { background: var(--a); color: #2b1800; }
.meter-chip[data-cmd="open"] { background: var(--b); color: #00202c; }
.meter-chip[data-cmd="switch"] { background: var(--violet); color: #fff; }
.meter-chip[data-cmd="lost"] { background: var(--bad); color: #fff; }

/* Emulator pads. */
.controls { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: var(--bg2); }
.pads.two { display: grid; grid-template-columns: 1fr 60px 1fr; gap: 10px; height: clamp(120px, 22dvh, 190px); }
.pad { position: relative; border-radius: 22px; overflow: hidden; background: var(--card2); border: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.pad.on { border-color: #fff; }
.pad-a .pad-fill { background: linear-gradient(0deg, var(--a), rgba(255,181,71,.5)); }
.pad-b .pad-fill { background: linear-gradient(0deg, var(--b), rgba(90,209,255,.5)); }
.pad-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height .05s linear; }
.pad-ticks { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 calc(25% - 1px), rgba(255,255,255,.12) calc(25% - 1px) 25%); pointer-events: none; }
.pad-label { position: absolute; left: 12px; top: 10px; display: grid; pointer-events: none; }
.pad-label b { font-size: 1.75rem; line-height: 1; }
.pad-label span { font-size: 0.8125rem; color: var(--muted); }
.pad-value { position: absolute; right: 12px; bottom: 10px; font-weight: 800; font-size: 1.125rem; pointer-events: none; }
.pad-co { border-radius: 18px; border: 2px dashed var(--violet); background: transparent; color: var(--violet); font-weight: 800; touch-action: none; cursor: pointer; }
.pad-co.on { background: var(--violet); color: #fff; }
.pads.gestures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.gkey { min-height: 64px; min-width: 0; border-radius: 16px; background: var(--card2); border: 2px solid var(--line); display: grid; grid-template-columns: 36px minmax(0, 1fr); align-items: center; gap: 4px; padding: 4px 6px; overflow-wrap: anywhere; line-height: 1.15; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; font-size: 0.8125rem; font-weight: 700; }
.gkey.on { border-color: var(--a); background: #3b2e1a; }
.gesture-icon { width: 36px; height: 36px; pointer-events: none; }
.avatar .gesture-icon { width: 44px; height: 44px; }
.pads-note { grid-column: 1 / -1; text-align: center; font-size: 0.75rem; color: var(--muted); margin: 2px 0 0; }
.bridge-panel { text-align: center; padding: 6px; display: grid; gap: 2px; }
.controls.compact .pads.two { height: 96px; }
.controls.compact .gkey { min-height: 48px; }
.bridge-status { color: var(--muted); font-size: 0.8125rem; }

/* Results & rest. */
.big-stars { font-size: 3.5rem; letter-spacing: 6px; color: var(--warn); animation: pop .5s cubic-bezier(.2,.9,.3,1.4); }
.big-stars.s0 { color: var(--muted); }
.big-score { font-size: 2.75rem; font-weight: 800; margin: 0; }
.big-score small { font-size: 1.125rem; color: var(--muted); }
.xp-gain { color: var(--good); font-weight: 700; }
.celebrate { background: linear-gradient(160deg, #134b3f, #17234b); text-align: center; }
.skill { display: grid; grid-template-columns: 110px 1fr 36px; gap: 10px; align-items: center; margin: 8px 0; font-size: 0.875rem; }
.skill b { text-align: right; }
.coach p { color: var(--muted); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.breath { width: 140px; height: 140px; margin: 16px auto; border-radius: 50%; background: radial-gradient(circle, var(--accent), #1d2b5a 70%); animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.7); } 50% { transform: scale(1); } }
.rest-count { display: block; font-size: 3rem; }
.rest .meter { border-radius: 14px; margin: 10px 0; }

/* Progress. */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { background: var(--card); border-radius: 14px; padding: 10px 4px; text-align: center; }
.stats b { display: block; font-size: 1.375rem; }
.stats small { color: var(--muted); font-size: 0.6875rem; }
.radar { display: block; margin: 0 auto; max-width: 100%; }
.trend { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.calendar small { color: var(--muted); font-size: 0.6875rem; }
.cal { aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,.07); }
.cal.l1 { background: rgba(63,224,160,.3); } .cal.l2 { background: rgba(63,224,160,.5); }
.cal.l3 { background: rgba(63,224,160,.75); } .cal.l4 { background: var(--good); }
.cal.future { opacity: .3; }
.badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.badge { background: var(--card2); border-radius: 14px; padding: 10px; opacity: .55; display: grid; gap: 2px; }
.badge.on { opacity: 1; border: 1px solid var(--warn); }
.badge small { color: var(--muted); font-size: 0.75rem; }
.skins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.skin { border: 2px solid var(--line); background: var(--card2); border-radius: 14px; padding: 6px; display: grid; justify-items: center; cursor: pointer; }
.skin.active { border-color: var(--accent); }
.skin small { font-size: 0.6875rem; color: var(--muted); }

/* Settings. */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--bg2); border-radius: 16px; padding: 4px; margin: 6px 0; }
.seg { min-height: 52px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; display: grid; align-content: center; padding: 6px; }
.seg b { font-size: 0.875rem; } .seg small { font-size: 0.6875rem; }
.seg.active { background: var(--accent); color: #06122e; }
.row { display: grid; gap: 6px; margin: 12px 0; font-size: 0.9375rem; }
.row > span { display: flex; justify-content: space-between; gap: 8px; }
.row small { display: block; color: var(--muted); font-size: 0.75rem; }
.row.toggle { grid-template-columns: 1fr auto; align-items: center; }
.row input[type=text], .row input[type=url], .row input[type=time] { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 0 12px; font: inherit; }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
input[type=checkbox] { width: 48px; height: 28px; accent-color: var(--good); }
output { color: var(--accent); font-weight: 700; }
.settings .pads.two { height: 120px; margin: 8px 0; }
.cal-ring { width: 120px; height: 120px; margin: 12px auto; }
.cal-ring::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: var(--bg); }
.cal-ring[data-step="a"] { background: conic-gradient(var(--a) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); }
.cal-ring[data-step="b"] { background: conic-gradient(var(--b) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); }
.calibration .pads.two { height: 120px; margin-top: 12px; }

/* Onboarding. */
.onboarding .scroll { padding-top: 40px; }
.onb-art { display: grid; place-items: center; margin: 10px auto 16px; }
.onb-art canvas { width: 110px; height: 110px; }
.big-emoji { font-size: 4.5rem; }
.onboarding .sticky-actions { padding-left: 16px; padding-right: 16px; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 99px; }

/* Toasts. */
#toasts { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 700; text-align: center; animation: rise .25s ease; transition: opacity .4s; }
.toast.good { border-color: var(--good); }
.toast.bad { border-color: var(--bad); }
.toast.out { opacity: 0; }

/* Accessibility modes (Settings → Доступность). */
:root.hc { --bg: #000; --bg2: #000; --card: #000; --card2: #101010; --line: #ffffff; --text: #ffffff; --muted: #e8ecff; }
:root.hc .card, :root.hc .btn, :root.hc .seg, :root.hc .game-card, :root.hc .level, :root.hc .pad, :root.hc .gkey, :root.hc .badge { border: 2px solid var(--line); }
:root.hc .hero, :root.hc .g-grip, :root.hc .g-flight, :root.hc .g-rhythm, :root.hc .g-safe, :root.hc .g-check, :root.hc .celebrate { background: #000; border: 2px solid var(--line); }
:root.hc .btn.primary, :root.hc .seg.active { background: #ffe14d; color: #000; }
:root.hc .note, :root.hc small { color: var(--muted); }
:root.rm *, :root.rm *::before, :root.rm *::after { animation: none !important; transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (min-width: 700px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* v5: check-in, tutorial, skill check, data tables, showcase, PIN. */
html { scroll-padding-bottom: 90px; } /* WCAG 2.2 «focus not obscured» by the bottom nav */
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.8125rem; }
.showcase-banner { position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--warn); color: #241a00; font-weight: 800; font-size: 0.8125rem; padding: 4px 12px; }
.showcase-banner .btn { color: #241a00; border-color: #241a00; }
.warn-card { border-color: var(--warn); }
.tutorial-card { border-color: var(--accent); }
.g-check { background: linear-gradient(160deg, #15405a, #17234b); }
.g-check.due { border: 2px solid var(--accent); }
.checkin .segmented { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); }
.checkin-advice { min-height: 48px; }
.tut-canvas { width: min(320px, 100%); height: auto; aspect-ratio: 4 / 3; display: block; margin: 0 auto; }
.tut-ring { width: 64px; height: 64px; }
.tutorial .controls .pads.two { height: 130px; }
.pin-input { font-size: 2rem; letter-spacing: 0.5em; text-align: center; width: 10ch; min-height: 60px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg2); color: var(--text); margin: 12px auto; display: block; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.8125rem; margin: 6px 0; }
table.data caption { text-align: left; color: var(--muted); font-size: 0.75rem; padding-bottom: 4px; }
table.data th, table.data td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
table.data th[scope="row"] { text-align: left; font-weight: 700; }
td.heat.h1 { background: rgba(255,107,107,.18); } td.heat.h2 { background: rgba(255,107,107,.35); }
td.heat.h3 { background: rgba(255,107,107,.55); } td.heat.h4 { background: rgba(255,107,107,.8); color: #fff; }

/* ===== v5 design layer — «Aurora»: dark-first, bento, soft tactile depth, expressive type, spring motion.
   Rules: solid surfaces under text (contrast ≥ 4.5:1), decoration only behind content, every motion
   disabled by .rm / prefers-reduced-motion, every gradient flattened by .hc. ===== */
:root {
  --bg: #0a1027; --bg2: #0f1734; --card: #141d40; --card2: #1b2753; --line: #27366b;
  --grad-accent: linear-gradient(135deg, #5ad1ff 0%, #7b8cff 55%, #a77bff 100%);
  --grad-warm: linear-gradient(135deg, #ffcf6b 0%, #ff9f5a 100%);
  --grad-good: linear-gradient(135deg, #3fe0a0 0%, #2bc2d6 100%);
  --shadow-1: 0 1px 0 rgba(255,255,255,.06) inset, 0 6px 18px rgba(0,0,0,.28);
  --shadow-2: 0 1px 0 rgba(255,255,255,.08) inset, 0 14px 34px rgba(0,0,0,.38);
  --glow-accent: 0 8px 26px rgba(90,209,255,.35);
  --spring: cubic-bezier(.2,.9,.25,1.25);
  --radius: 22px;
}
body {
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(123,140,255,.20), transparent 60%),
    radial-gradient(700px 480px at -10% 30%, rgba(90,209,255,.12), transparent 60%),
    radial-gradient(800px 600px at 50% 120%, rgba(167,123,255,.14), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
.app { background: transparent; }
h1 { font-size: 1.875rem; font-weight: 850; letter-spacing: -0.6px; }
h2 { font-weight: 800; letter-spacing: -0.2px; }
.stats b, .big-score, .score, .streak b, .pill, output, .rest-count, table.data td { font-variant-numeric: tabular-nums; }
.eyebrow { letter-spacing: 1.4px; background: var(--grad-accent); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Surfaces: soft tactile depth, light top edge. */
.card { background: linear-gradient(180deg, var(--card2) 0%, var(--card) 100%); border: 1px solid var(--line); box-shadow: var(--shadow-1); border-radius: var(--radius); }
.card h2 { display: flex; align-items: center; gap: 8px; }

/* Buttons: oversized, pill-shaped, gradient primary with glow (M3 Expressive). */
.btn { border-radius: 999px; transition: transform .18s var(--spring), box-shadow .18s ease, filter .18s ease; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--grad-accent); color: #061233; box-shadow: var(--glow-accent); }
.btn.primary:disabled { box-shadow: none; filter: saturate(.4); }
.btn.big { min-height: 64px; font-size: 1.15rem; letter-spacing: .2px; }
.btn.ghost { border-color: var(--line); background: rgba(255,255,255,.03); }

/* Home hero: aurora panel with decorative orbs behind the content. */
.hero { position: relative; overflow: hidden; background: linear-gradient(150deg, #20307a 0%, #2a2272 55%, #3a1f6e 100%); box-shadow: var(--shadow-2); border: 1px solid rgba(255,255,255,.08); }
.hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; }
.hero::before { width: 220px; height: 220px; right: -70px; top: -90px; background: radial-gradient(circle, rgba(90,209,255,.35), transparent 70%); }
.hero::after { width: 180px; height: 180px; left: -60px; bottom: -90px; background: radial-gradient(circle, rgba(255,181,71,.25), transparent 70%); }
.hero > * { position: relative; }
.avatar { background: var(--grad-accent); box-shadow: var(--glow-accent); }
.streak { background: var(--grad-warm); color: #2b1600; font-weight: 800; box-shadow: 0 6px 18px rgba(255,159,90,.35); }
.xp-track, .skill-track { height: 12px; background: rgba(255,255,255,.09); }
.xp-track i, .skill-track i { background: var(--grad-good); box-shadow: 0 0 12px rgba(63,224,160,.45); }
.day i { width: 30px; height: 30px; }
.day.done i { background: var(--grad-good); border-color: transparent; box-shadow: 0 0 10px rgba(63,224,160,.5); }
.day.today i { border-width: 3px; }

/* Plan: stepper look. */
.plan-list li { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 18px; }
.plan-list li.done { opacity: .55; }
.plan-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: rgba(90,209,255,.12); font-size: 1.3rem; }
.plan-list li.done .plan-icon { background: var(--grad-good); color: #04261a; font-weight: 900; }

/* Games: bento grid — the first card spans two columns. */
.game-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
.game-card { position: relative; overflow: hidden; border-radius: 24px; box-shadow: var(--shadow-1); transition: transform .2s var(--spring); min-height: 160px; }
.game-card:first-child { grid-column: 1 / -1; min-height: 150px; }
.game-card::after { content: ''; position: absolute; right: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); pointer-events: none; }
.game-card:active { transform: scale(.97); }
.game-icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 18px; background: rgba(255,255,255,.1); font-size: 1.75rem; }
.g-grip { background: linear-gradient(150deg, #2b4bb3 0%, #1b2a66 100%); }
.g-flight { background: linear-gradient(150deg, #4a3bb5 0%, #221c63 100%); }
.g-rhythm { background: linear-gradient(150deg, #7a2f9e 0%, #2c1559 100%); }
.g-safe { background: linear-gradient(150deg, #126a8a 0%, #12305a 100%); }
.g-check { background: linear-gradient(150deg, #13586e 0%, #14284f 100%); }
.game-meta { color: #ffe08a; }

/* Levels. */
.level { border-radius: 20px; background: linear-gradient(180deg, var(--card2), var(--card)); box-shadow: var(--shadow-1); }
.level.rec { border: 2px solid transparent; background: linear-gradient(var(--card2), var(--card)) padding-box, var(--grad-accent) border-box; }

/* Bottom navigation: floating pill with an active indicator (M3). */
.bottom-nav { bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 536px; border: 1px solid var(--line); border-radius: 26px; background: rgba(15,23,52,.96); box-shadow: var(--shadow-2); padding-bottom: 0; }
.nav-item { min-height: 64px; gap: 2px; }
.nav-item .nav-icon { padding: 4px 18px; border-radius: 999px; transition: background .2s ease; }
.nav-item.active .nav-icon { background: rgba(90,209,255,.18); }
.scroll { padding-bottom: 130px; }

/* Segmented control and toggles. */
.segmented { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 20px; }
.seg { border-radius: 16px; transition: background .2s ease, transform .18s var(--spring); }
.seg.active { background: var(--grad-accent); color: #061233; box-shadow: var(--glow-accent); }

/* Play: HUD and meters. */
.play-top { background: rgba(10,16,39,.9); }
.play-progress i { background: var(--grad-accent); box-shadow: 0 0 10px rgba(90,209,255,.6); }
.meter { background: rgba(15,23,52,.98); }
.meter-bar.a .fill { background: linear-gradient(90deg, #ff9f5a, #ffcf6b); box-shadow: 0 0 10px rgba(255,181,71,.5); }
.meter-bar.b .fill { background: linear-gradient(90deg, #2bb6e6, #8be3ff); box-shadow: 0 0 10px rgba(90,209,255,.5); }
.pad { border-radius: 26px; box-shadow: var(--shadow-1); }
.pad.on { box-shadow: 0 0 0 2px #fff, 0 0 24px rgba(255,255,255,.25); }
.sheet { border-radius: 28px; box-shadow: var(--shadow-2); background: linear-gradient(180deg, var(--card2), var(--card)); }
.confirm-ring, .cal-ring { background: conic-gradient(#ffcf6b calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); }

/* Results: celebratory hierarchy. */
.big-stars { font-size: 4rem; text-shadow: 0 6px 24px rgba(255,204,77,.45); }
.big-score { font-size: 3.25rem; font-weight: 900; letter-spacing: -1px; }
.xp-gain { display: inline-block; padding: 4px 14px; border-radius: 999px; background: rgba(63,224,160,.14); }
.celebrate { background: linear-gradient(150deg, #11624d, #14284f); }
.stats div { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); box-shadow: var(--shadow-1); border-radius: 18px; }
.stats b { font-size: 1.5rem; font-weight: 850; }
.badge.on { background: linear-gradient(150deg, rgba(255,204,77,.18), rgba(255,159,90,.08)); border: 1px solid rgba(255,204,77,.6); }

/* Onboarding art. */
.onb-art canvas { filter: drop-shadow(0 12px 30px rgba(90,209,255,.45)); }

/* High contrast and reduced motion always win over decoration. */
:root.hc body { background: #000; }
:root.hc .hero::before, :root.hc .hero::after, :root.hc .game-card::after { display: none; }
:root.hc .btn.primary, :root.hc .seg.active, :root.hc .avatar, :root.hc .streak { background: #ffe14d; color: #000; box-shadow: none; }
:root.hc .eyebrow { background: none; color: #ffe14d; }
:root.hc .card, :root.hc .stats div, :root.hc .level, :root.hc .sheet { background: #000; box-shadow: none; }
:root.hc .bottom-nav { background: #000; border: 2px solid #fff; }
</style>
