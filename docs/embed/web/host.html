<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хост «Синергии» — пример встраивания</title>
<!--
  Example host (docs/embed/README.md, «Web»): embeds «Синергия» in an iframe of another origin, hears its messages,
  starts exercises and streams a signal — all through postMessage, the only way between two origins.
  Open: host.html?src=<address of index.html of «Синергии»>  (tests/e2e/embed.mjs serves both and drives this page).
  Plain JS, no build: copy what you need into your app.
-->
<style>
  :root { color-scheme: light dark; font: 16px/1.4 system-ui, sans-serif; }
  body { margin: 0; padding: 16px; display: grid; gap: 12px; max-width: 960px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #888; background: Canvas; color: CanvasText; }
  iframe { width: 100%; max-width: 420px; height: 760px; border: 1px solid #888; border-radius: 16px; }
  pre { margin: 0; padding: 8px; border: 1px solid #888; border-radius: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Пример хоста</h1>
<p id="status" role="status">Ждём «Синергию»…</p>
<div class="row" id="games" aria-label="Упражнения"></div>
<div class="row"><button id="signal" type="button" aria-pressed="false">Демо-сигнал</button></div>
<iframe id="game" title="Синергия" allow="autoplay"></iframe>
<h2>Сообщения</h2>
<pre id="log" aria-live="polite"></pre>
<script>
  // Where «Синергия» lives. Its origin is the only one whose messages we accept, and the only one we post to.
  const params = new URLSearchParams(location.search);
  const GAME = new URL(params.get('src') || '../../../dist/index.html', location.href);
  const frame = document.getElementById('game');
  const log = text => { document.getElementById('log').textContent += `${text}\n`; };
  const status = text => { document.getElementById('status').textContent = text; };

  // ?game — the exercise to open (after the safety onboarding on the first run); ?host — our origin, so the game
  // knows whom to answer (it never posts to «*»).
  const url = new URL(GAME);
  url.searchParams.set('game', params.get('game') || 'flight');
  url.searchParams.set('level', params.get('level') || '1');
  url.searchParams.set('host', location.origin);
  frame.src = url.href;

  const post = command => frame.contentWindow.postMessage(command, GAME.origin);

  window.addEventListener('message', e => {
    if (e.origin !== GAME.origin || e.source !== frame.contentWindow) return; // someone else's message
    const m = e.data;
    if (!m || typeof m.type !== 'string' || m.protocol !== 1) return;
    log(JSON.stringify(m));
    if (m.type === 'synergy:ready') {
      status(m.onboarded ? `Готово: «Синергия» ${m.version}` : `«Синергия» ${m.version}: сначала знакомство и безопасность`);
      document.getElementById('games').replaceChildren(...m.games.map(g => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = g.title;
        b.onclick = () => { frame.hidden = false; post({ type: 'synergy-start', game: g.id, level: 1 }); };
        return b;
      }));
    } else if (m.type === 'synergy:result') {
      status(`Результат: ${m.game}, уровень ${m.level} — ${m.score} из 100, звёзд: ${m.stars}`);
    } else if (m.type === 'synergy:close') {
      status(m.reason === 'done' ? 'Человек закончил — возвращаемся в своё приложение' : 'Назад на главной «Синергии»');
      frame.hidden = true; // your app shows its own screen here
    }
  });

  // The signal: your prosthesis SDK or sensor calls sendFrame(a, b, gesture) — values 0…1 (docs/INTEGRATION.md).
  // Here a slow demo wave stands in for it. The game listens only while frames keep coming (watchdog 300 ms).
  const sendFrame = (a, b, gesture) => post({ type: 'synergy-frame', a, b, ...(gesture ? { gesture } : {}) });
  let timer = null;
  document.getElementById('signal').onclick = e => {
    const on = !timer;
    e.currentTarget.setAttribute('aria-pressed', String(on));
    if (!on) { clearInterval(timer); timer = null; return; }
    const t0 = performance.now();
    timer = setInterval(() => {
      const t = (performance.now() - t0) / 1000;
      const wave = Math.sin(t * 1.3);
      sendFrame(Math.max(0, wave) * 0.7, Math.max(0, -wave) * 0.6);
    }, 20);
  };

  // Late listeners: ask again whether the game is up (it answers with synergy:ready).
  frame.addEventListener('load', () => post({ type: 'synergy-ping' }));
</script>
</body>
</html>
