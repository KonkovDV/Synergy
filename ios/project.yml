# «Синергия» for iPhone and iPad (5.30) — an XcodeGen spec, so the Xcode project is generated, not committed.
#   npm run build                       # dist/ — the game the app bundles
#   xcodegen generate --spec ios/project.yml && open ios/Synergy.xcodeproj
# Signing: set DEVELOPMENT_TEAM (the team's Apple ID) in Xcode; CI builds for the simulator without signing
# (.github/workflows/ios.yml). Details: ios/README.md.
name: Synergy
options:
  bundleIdPrefix: ru.synergy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "6.3.1"
    CURRENT_PROJECT_VERSION: "51"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  Synergy:
    type: application
    platform: iOS
    sources:
      - path: Synergy
      # The built game as a folder reference: Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "dist")
      - path: ../dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.synergy.trainer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Synergy/Info.plist
      properties:
        CFBundleDisplayName: Синергия
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.educational-games # a training game, not a medical device (docs/LEGAL.md §2)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        # Orientation is not locked (WCAG 1.3.4), as in the APK and the PWA.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: ru.synergy.trainer
            CFBundleURLSchemes: [synergy]
        # ws:// to the desktop bridge or the organizers' emulator on the local network (tools, bridge/ws_bridge.py).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Игра получает сигнал датчиков или эмулятора с компьютера в вашей сети.
        ITSAppUsesNonExemptEncryption: false
