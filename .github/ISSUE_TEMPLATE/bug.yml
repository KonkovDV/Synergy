name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes: { label: Шаги, description: "Экран, игра, уровень, схема управления, источник сигнала" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Ожидалось и получилось }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Устройство и версия, placeholder: "Android 14, APK 5.23.0 / Chrome 140" }
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: Я не прикладываю персональные данные и данные о здоровье (отчёты, копии) без обезличивания
          required: true
