name: iOS
# 5.30 — the iPhone app (ios/): generated by XcodeGen, built for the simulator without signing, launched, a screenshot
# of the home screen and of a link-opened exercise kept as an artifact. macOS minutes cost ten Linux ones, so it runs by
# hand and on a release tag, not on every push. Signing for a device or TestFlight: ios/README.md.
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: read }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts && npm run build
      - name: XcodeGen 2.44.1 (SHA-256 checked, as tools/*.sh check their downloads)
        run: |
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml
      - name: Build for the simulator (no signing)
        run: xcodebuild -project ios/Synergy.xcodeproj -target Synergy -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/ios/build" build
      - name: Launch on a simulator, open a link, take screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          xcrun simctl boot "$DEVICE"
          xcrun simctl install booted ios/build/Debug-iphonesimulator/Synergy.app
          xcrun simctl launch booted ru.synergy.trainer
          sleep 10 && xcrun simctl io booted screenshot ios-home.png
          xcrun simctl openurl booted "synergy://play?game=duo&level=1"
          sleep 6 && xcrun simctl io booted screenshot ios-duo.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: ios-screenshots, path: 'ios-*.png' }
