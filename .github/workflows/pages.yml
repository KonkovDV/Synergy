name: Pages (PWA)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    # A Pages site is public even when its repository is private: a private draft must not publish the product.
    if: ${{ !github.event.repository.private }}
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts && npm test && npm run build   # no install scripts next to the deploy token
      # 17.11.2026 — the pitch of the final beside the game: /pitch/ is not part of the build and has its own service worker,
      # so the game's offline cache does not keep it (pitch/sw.js). Downloads link to the repository, not to this site.
      - run: mkdir -p dist/pitch && cp -R pitch/index.html pitch/app.js pitch/sw.js pitch/web pitch/synergy-gameplay-reel.mp4 dist/pitch/ && cp pitch/404.html dist/404.html && cp submission/Synergy-6.3.4-screencast.mp4 dist/pitch/
      # 18.11.2026 — the page names the commit it is built from; the tests above passed on it (pitch/app.js shows it).
      - run: printf '{"sha":"%s","run":"%s","at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%MZ)" > dist/pitch/build.json
      # 19.11.2026 — the proposal for Motorica's management: /motorica/, its own service worker (scope /motorica/), the deck,
      # its PDF and the Excel model next to the page. slides.json stays in the repository: the page already holds its text.
      # 20.11.2026 — the deck is the page itself (50 slides in HTML and SVG): no slide pictures, only img/ with the screens.
      # 23.11.2026 — the reader's route of the innovation department has its own PDF (MOTUS-Lab-Motorica-innov.pdf).
      - run: node tools/check-motorica.mjs
      - run: mkdir -p dist/motorica && cp -R motorica/index.html motorica/plan.html motorica/site.css motorica/app.js motorica/sw.js motorica/og.jpg motorica/og-innov.jpg motorica/neuro motorica/fonts motorica/img motorica/MOTUS-Lab-Motorica.pptx motorica/MOTUS-Lab-Motorica.pdf motorica/MOTUS-Lab-Motorica-innov.pdf motorica/MOTUS-Lab-Motorica-model.xlsx dist/motorica/
      - run: cp dist/pitch/build.json dist/motorica/build.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
