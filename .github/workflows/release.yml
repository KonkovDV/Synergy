name: Release
on:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci && npm test
      - name: Build and sign APK with the team key (repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SYNERGY_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SYNERGY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Нет секрета KEYSTORE_BASE64: релиз без своего ключа запрещён"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SYNERGY_KEYSTORE="$RUNNER_TEMP/release.keystore" VERIFY_API=1 sh tools/build-apk.sh
      - name: Publish release assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/build/synergy.apk "Synergy-${GITHUB_REF_NAME#v}.apk"
          gh release create "$GITHUB_REF_NAME" "Synergy-${GITHUB_REF_NAME#v}.apk" dist/synergy-standalone.html \
            --title "Синергия ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
