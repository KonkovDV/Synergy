version: 2
# cooldown (5.29): a new release is proposed after 7 days, not on the day it appears. Most malicious releases of 2024–2025
# (chalk, Nx, tj-actions, rspack…) were removed within a week; security updates are not delayed. tools/supply-chain.mjs
# checks it.
# After the submission (17.11.2026) pull requests with new versions are off: open-pull-requests-limit 0. Security
# alerts and security updates are not affected.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
